<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music — Aether</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;background:#0a0a12;font-family:'Rajdhani',sans-serif;color:#fff}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 60px}
h1{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:32px;letter-spacing:3px;
  margin-bottom:6px;text-shadow:0 0 30px rgba(0,0,0,.5);
  background:linear-gradient(135deg,#6ee7ff,#a78bfa,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:36px;letter-spacing:1px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.toggle-bar{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.toggle-btn{
  padding:12px 28px;border-radius:14px;border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.6);
  font:700 15px 'Rajdhani',sans-serif;letter-spacing:1px;cursor:pointer;
  transition:all .4s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.toggle-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.toggle-btn.active-happy{
  background:linear-gradient(135deg,rgba(255,180,50,.3),rgba(255,220,100,.15));
  border-color:rgba(255,200,80,.5);color:#ffd76a;
  box-shadow:0 0 25px rgba(255,180,50,.2);
}
.toggle-btn.active-sad{
  background:linear-gradient(135deg,rgba(60,100,180,.3),rgba(80,140,220,.15));
  border-color:rgba(80,140,220,.5);color:#7eb8ff;
  box-shadow:0 0 25px rgba(60,100,180,.2);
}
.toggle-btn.active-idk{
  background:linear-gradient(135deg,rgba(80,220,180,.3),rgba(120,255,200,.15));
  border-color:rgba(80,220,180,.5);color:#6ef0c0;
  box-shadow:0 0 25px rgba(80,220,180,.2);
}
.playlist-container{
  width:100%;max-width:420px;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:16px;
  box-shadow:0 0 50px rgba(0,0,0,.3);
}
.playlist-frame{width:100%;border-radius:12px;overflow:hidden}
.playlist-frame iframe{width:100%;border:none;border-radius:12px;display:block}
.playlist-label{
  font:600 12px 'Rajdhani',sans-serif;
  color:rgba(255,255,255,.4);letter-spacing:1.5px;
  text-transform:uppercase;text-align:center;
  margin-bottom:10px;
}
.hidden{display:none}
.backlink{
  position:fixed;bottom:12px;left:16px;z-index:9999;
  color:rgba(255,255,255,.5);font:600 13px 'Rajdhani',sans-serif;
  text-decoration:none;letter-spacing:.5px;transition:color .3s;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.backlink:hover{color:#fff}
.note{
  margin-top:20px;font-size:12px;color:rgba(255,255,255,.25);
  max-width:380px;text-align:center;line-height:1.6;
  text-shadow:0 1px 4px rgba(0,0,0,.4);
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="page">
  <h1>MUSIC</h1>
  <div class="subtitle">what's the mood?</div>

  <div class="toggle-bar">
    <button class="toggle-btn active-happy" id="btnHappy">☀ Happy</button>
    <button class="toggle-btn" id="btnSad">☾ Sad</button>
    <button class="toggle-btn" id="btnIdk">✧ idk</button>
  </div>

  <div class="playlist-container" id="happyPlaylist">
    <div class="playlist-label">Happy Vibes</div>
    <div class="playlist-frame">
      <iframe id="happyFrame" height="480"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>
  </div>

  <div class="playlist-container hidden" id="sadPlaylist">
    <div class="playlist-label">Sad Hours</div>
    <div class="playlist-frame">
      <iframe id="sadFrame" height="480"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>
  </div>

  <div class="playlist-container hidden" id="idkPlaylist">
    <div class="playlist-label">idk, just vibes</div>
    <div class="playlist-frame">
      <iframe id="idkFrame" height="480"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </div>
  </div>

  <div class="note">
    Playback requires a Spotify account. Free accounts hear previews; Premium gets full tracks.
  </div>
</div>

<a class="backlink" href="index.html">&larr; home</a>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════
   PASTE YOUR SPOTIFY PLAYLIST LINKS HERE
   ══════════════════════════════════════════════════════ */

var HAPPY_LINK = 'https://open.spotify.com/playlist/34UlalESScclj0lDLIDpHg?si=zJFA362PRN6zaT581PY5-Q&utm_source=copy-link&pi=VtlIzTyzRTa2Q';
var SAD_LINK   = 'https://open.spotify.com/playlist/1isQ5e77FcGqxZTOExEOiz?si=eblbcEmmThuDvm_GTcEa5g&utm_source=copy-link&pi=J-VXp-__QmGcp';
var IDK_LINK   = 'https://open.spotify.com/playlist/1W9njYkZJ1jmenGHnt0dow?si=rw4QN3zPTTGzMS-oD5hObQ&utm_source=copy-link&pi=QyzTnC70TwaGZ';

/* ══════════════════════════════════════════════════════ */

function extractId(link){
  var m=link.match(/playlist[\/:]([A-Za-z0-9]+)/);
  if(m) return m[1];
  if(/^[A-Za-z0-9]{15,}$/.test(link.trim())) return link.trim();
  return link;
}
function embedUrl(link){
  return 'https://open.spotify.com/embed/playlist/'+extractId(link)+'?utm_source=generator&theme=0';
}

var pl={
  happy:{frame:document.getElementById('happyFrame'),div:document.getElementById('happyPlaylist'),btn:document.getElementById('btnHappy'),link:HAPPY_LINK,loaded:false,ac:'active-happy'},
  sad:{frame:document.getElementById('sadFrame'),div:document.getElementById('sadPlaylist'),btn:document.getElementById('btnSad'),link:SAD_LINK,loaded:false,ac:'active-sad'},
  idk:{frame:document.getElementById('idkFrame'),div:document.getElementById('idkPlaylist'),btn:document.getElementById('btnIdk'),link:IDK_LINK,loaded:false,ac:'active-idk'}
};
pl.happy.frame.src=embedUrl(HAPPY_LINK);
pl.happy.loaded=true;

var current='happy', target='happy', transA=0;

function switchTo(mood){
  if(mood===current&&mood===target) return;
  Object.keys(pl).forEach(function(k){
    pl[k].div.classList.add('hidden');
    pl[k].btn.className='toggle-btn';
  });
  var n=pl[mood];
  if(!n.loaded){n.frame.src=embedUrl(n.link);n.loaded=true;}
  n.div.classList.remove('hidden');
  n.btn.className='toggle-btn '+n.ac;
  target=mood; transA=0;
}

pl.happy.btn.addEventListener('click',function(){switchTo('happy');});
pl.sad.btn.addEventListener('click',function(){switchTo('sad');});
pl.idk.btn.addEventListener('click',function(){switchTo('idk');});

/* ── CANVAS ── */
var C=document.getElementById('bg');
var ctx=C.getContext('2d');
var W,H,dpr=Math.min(window.devicePixelRatio||1,2);

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  C.width=W*dpr;C.height=H*dpr;
  C.style.width=W+'px';C.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initAll();
}

/* ═══════════════════════════════════════
   HAPPY — Bustling city with skyscrapers
   ═══════════════════════════════════════ */
var cityB=[],cityCars=[],cityStars=[];

function initCity(){
  cityB=[];
  for(var i=0;i<25;i++){
    var bw=30+Math.random()*55;
    cityB.push({x:i*(W/25)-10+Math.random()*20,w:bw,h:H*0.2+Math.random()*H*0.35,
      col:'hsl('+(200+Math.random()*40)+',15%,'+(8+Math.random()*7)+'%)',wins:[],layer:0,ant:Math.random()>0.5});
  }
  for(var i=0;i<15;i++){
    var bw=40+Math.random()*75;
    cityB.push({x:i*(W/15)-20+Math.random()*25,w:bw,h:H*0.25+Math.random()*H*0.38,
      col:'hsl('+(210+Math.random()*30)+',12%,'+(5+Math.random()*5)+'%)',wins:[],layer:1,ant:Math.random()>0.4});
  }
  cityB.forEach(function(b){
    var cols=Math.floor(b.w/12),rows=Math.floor(b.h/16);
    for(var r=1;r<rows;r++) for(var c=1;c<cols;c++){
      if(Math.random()>0.35) b.wins.push({rx:c/cols,ry:r/rows,on:Math.random()>0.3,hue:30+Math.random()*30,ph:Math.random()*Math.PI*2,sp:Math.random()*0.003+0.001});
    }
  });
  cityCars=[];
  for(var i=0;i<12;i++) cityCars.push({x:Math.random()*W,y:H-30-Math.random()*22,spd:(Math.random()*1.5+0.5)*(Math.random()>0.5?1:-1),col:Math.random()>0.5?'#ff4444':'#ffcc44',tail:Math.random()>0.5?'#ff2222':'#ffaa00',w:12+Math.random()*8});
  cityStars=[];
  for(var i=0;i<40;i++) cityStars.push({x:Math.random()*W,y:Math.random()*H*0.28,r:Math.random()+0.3,ph:Math.random()*Math.PI*2});
}

function drawCity(t){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0e1a');sky.addColorStop(0.3,'#121830');sky.addColorStop(0.6,'#1a1520');sky.addColorStop(0.85,'#1e1018');sky.addColorStop(1,'#1a0e10');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  var glow=ctx.createRadialGradient(W*0.5,H,0,W*0.5,H,H*0.8);
  glow.addColorStop(0,'rgba(255,160,60,.08)');glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  for(var i=0;i<cityStars.length;i++){var s=cityStars[i];ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,240,'+(0.3+0.4*Math.sin(t*0.001+s.ph))+')';ctx.fill();}

  cityB.sort(function(a,b){return a.layer-b.layer;});
  for(var i=0;i<cityB.length;i++){
    var b=cityB[i],by=H-b.h;
    ctx.fillStyle=b.col;ctx.fillRect(b.x,by,b.w,b.h);
    if(b.ant){
      ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(b.x+b.w*.5,by);ctx.lineTo(b.x+b.w*.5,by-12-b.w*.1);ctx.stroke();
      ctx.beginPath();ctx.arc(b.x+b.w*.5,by-12-b.w*.1,2,0,Math.PI*2);
      ctx.fillStyle='rgba(255,50,50,'+(Math.sin(t*.003+i)>.7?.8:.1)+')';ctx.fill();
    }
    for(var j=0;j<b.wins.length;j++){
      var w=b.wins[j],wx=b.x+w.rx*b.w,wy=by+w.ry*b.h;
      if(w.on){var fa=.5+.3*Math.sin(t*w.sp+w.ph);ctx.fillStyle='hsla('+w.hue+',70%,65%,'+fa+')';ctx.fillRect(wx,wy,6,5);ctx.fillStyle='hsla('+w.hue+',70%,80%,'+fa*.3+')';ctx.fillRect(wx-1,wy-1,8,7);}
      else{ctx.fillStyle='rgba(20,25,40,.6)';ctx.fillRect(wx,wy,6,5);}
    }
  }

  ctx.fillStyle='#0d0d0d';ctx.fillRect(0,H-35,W,35);
  for(var x=0;x<W;x+=60){ctx.fillStyle='rgba(255,200,50,.3)';ctx.fillRect(x+(t*.03)%60,H-19,25,2);}

  for(var i=0;i<cityCars.length;i++){
    var c=cityCars[i];c.x+=c.spd;if(c.x>W+30)c.x=-30;if(c.x<-30)c.x=W+30;
    ctx.fillStyle='rgba(30,30,40,.9)';ctx.fillRect(c.x-c.w/2,c.y-4,c.w,8);
    var hlx=c.spd>0?c.x+c.w/2:c.x-c.w/2;ctx.beginPath();ctx.arc(hlx,c.y,3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,200,.7)';ctx.fill();
    var tlx=c.spd>0?c.x-c.w/2:c.x+c.w/2;ctx.beginPath();ctx.arc(tlx,c.y,2,0,Math.PI*2);ctx.fillStyle=c.tail;ctx.globalAlpha=.6;ctx.fill();ctx.globalAlpha=1;
  }
}

/* ═══════════════════════════════════
   SAD — Night blue sea with waves
   ═══════════════════════════════════ */
var seaWaves=[],seaFoam=[],seaStars=[];

function initSea(){
  seaWaves=[];
  for(var i=0;i<8;i++) seaWaves.push({y:H*.45+i*H*.07,amp:8+i*3,freq:.008-i*.0005,spd:.0008+i*.0002,ph:Math.random()*Math.PI*2,alpha:.15+i*.06,col:i<3?'40,80,160':'20,50,120'});
  seaFoam=[];
  for(var i=0;i<30;i++) seaFoam.push({x:Math.random()*W,y:H*.44+Math.random()*H*.08,r:Math.random()*3+1,ph:Math.random()*Math.PI*2});
  seaStars=[];
  for(var i=0;i<60;i++) seaStars.push({x:Math.random()*W,y:Math.random()*H*.4,r:Math.random()*1.2+.2,ph:Math.random()*Math.PI*2});
}

function drawSea(t){
  var sky=ctx.createLinearGradient(0,0,0,H*.5);
  sky.addColorStop(0,'#04060e');sky.addColorStop(.4,'#0a1025');sky.addColorStop(.8,'#0e1a3a');sky.addColorStop(1,'#142040');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.5);

  for(var i=0;i<seaStars.length;i++){var s=seaStars[i];ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(180,200,255,'+(0.25+.5*Math.sin(t*.0008+s.ph))+')';ctx.fill();}

  var mx=W*.75,my=H*.12,mr=35;
  ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fillStyle='rgba(200,215,240,.85)';ctx.fill();
  ctx.beginPath();ctx.arc(mx,my,mr+8,0,Math.PI*2);ctx.fillStyle='rgba(150,180,220,.06)';ctx.fill();
  ctx.beginPath();ctx.arc(mx,my,mr+20,0,Math.PI*2);ctx.fillStyle='rgba(130,160,210,.03)';ctx.fill();

  for(var i=0;i<15;i++){var ry=H*.45+i*8,rw=20-i*.8+Math.sin(t*.002+i)*3;ctx.fillStyle='rgba(180,200,230,'+(0.06-i*.003)+')';ctx.fillRect(mx-rw/2+Math.sin(t*.001+i*.5)*5,ry,rw,3);}

  ctx.fillStyle='#0a1428';ctx.fillRect(0,H*.45,W,H*.55);

  for(var i=0;i<seaWaves.length;i++){
    var w=seaWaves[i];ctx.beginPath();ctx.moveTo(0,H);
    for(var x=0;x<=W;x+=4){var y=w.y+Math.sin(x*w.freq+t*w.spd+w.ph)*w.amp+Math.sin(x*w.freq*2.3+t*w.spd*1.5)*w.amp*.3;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='rgba('+w.col+','+w.alpha+')';ctx.fill();
  }

  for(var i=0;i<seaFoam.length;i++){
    var f=seaFoam[i];var fy=f.y+Math.sin(t*.002+f.ph)*4;var fa=.2+.3*Math.sin(t*.002+f.ph);
    ctx.beginPath();ctx.arc(f.x+Math.sin(t*.001+f.ph)*.3,fy,f.r,0,Math.PI*2);
    ctx.fillStyle='rgba(180,210,240,'+Math.max(0,fa)+')';ctx.fill();
  }

  var crashX=W*.3+Math.sin(t*.0005)*W*.2,crashY=H*.48,crashA=.15+.1*Math.sin(t*.001);
  ctx.beginPath();for(var x=crashX-60;x<crashX+60;x+=3)ctx.lineTo(x,crashY+Math.sin((x-crashX)*.08+t*.003)*6);
  ctx.strokeStyle='rgba(200,225,255,'+crashA+')';ctx.lineWidth=2;ctx.stroke();
}

/* ══════════════════════════════════════════════
   IDK — Aurora borealis over snowy mountains
   ══════════════════════════════════════════════ */
var auroraStars=[],snowflakes=[],auroraBands=[];

function initAurora(){
  auroraStars=[];
  for(var i=0;i<100;i++) auroraStars.push({x:Math.random()*W,y:Math.random()*H*.45,r:Math.random()*1.2+.2,ph:Math.random()*Math.PI*2});

  snowflakes=[];
  for(var i=0;i<150;i++) snowflakes.push({
    x:Math.random()*W, y:Math.random()*H,
    r:Math.random()*2.5+.5,
    vy:Math.random()*.8+.3,
    vx:Math.random()*.4-.2,
    ph:Math.random()*Math.PI*2,
    a:Math.random()*.5+.2
  });

  auroraBands=[];
  for(var i=0;i<5;i++){
    var pts=[];
    var numPts=8+Math.floor(Math.random()*5);
    for(var j=0;j<numPts;j++){
      pts.push({
        xBase:j/(numPts-1)*W,
        yBase:H*.08+i*H*.06+Math.random()*H*.05,
        ampX:Math.random()*30+10,
        ampY:Math.random()*25+10,
        spdX:Math.random()*.0006+.0003,
        spdY:Math.random()*.0004+.0002,
        phX:Math.random()*Math.PI*2,
        phY:Math.random()*Math.PI*2
      });
    }
    var hue=120+i*25+Math.random()*20;
    auroraBands.push({pts:pts,hue:hue,width:H*.06+Math.random()*H*.04,alpha:.06+Math.random()*.04,
      pulseSpeed:Math.random()*.0008+.0004,pulsePh:Math.random()*Math.PI*2});
  }
}

function getMountainY(x,seed,baseY,scale){
  return baseY
    -Math.abs(Math.sin(x*.003+seed))*H*scale
    -Math.abs(Math.sin(x*.007+seed*2))*H*scale*.4
    -Math.abs(Math.sin(x*.0015+seed*3))*H*scale*.6;
}

function drawAurora(t){
  // Dark night sky
  var sky=ctx.createLinearGradient(0,0,0,H*.5);
  sky.addColorStop(0,'#020408');
  sky.addColorStop(.3,'#04080e');
  sky.addColorStop(.6,'#060c16');
  sky.addColorStop(1,'#0a1018');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // Stars
  for(var i=0;i<auroraStars.length;i++){
    var s=auroraStars[i];
    var a=.2+.5*Math.sin(t*.0006+s.ph);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(220,230,255,'+a+')';ctx.fill();
  }

  // Aurora bands
  for(var b=0;b<auroraBands.length;b++){
    var band=auroraBands[b];
    var pulse=.6+.4*Math.sin(t*band.pulseSpeed+band.pulsePh);
    var pts=band.pts;
    var coords=[];
    for(var p=0;p<pts.length;p++){
      var pt=pts[p];
      coords.push({
        x:pt.xBase+Math.sin(t*pt.spdX+pt.phX)*pt.ampX,
        y:pt.yBase+Math.sin(t*pt.spdY+pt.phY)*pt.ampY
      });
    }

    // Draw multiple translucent layers for glow depth
    for(var layer=0;layer<3;layer++){
      var spread=band.width*(1+layer*.5);
      var layerAlpha=band.alpha*pulse*(1-layer*.3);

      ctx.beginPath();
      ctx.moveTo(coords[0].x,coords[0].y-spread/2);

      // Top edge
      for(var p=1;p<coords.length;p++){
        var prev=coords[p-1],curr=coords[p];
        var cpx=(prev.x+curr.x)/2, cpy=(prev.y+curr.y)/2-spread/2;
        ctx.quadraticCurveTo(prev.x,prev.y-spread/2,cpx,cpy);
      }
      ctx.lineTo(coords[coords.length-1].x,coords[coords.length-1].y-spread/2);

      // Bottom edge (reverse)
      for(var p=coords.length-1;p>=1;p--){
        var prev=coords[p],curr=coords[p-1];
        var cpx=(prev.x+curr.x)/2, cpy=(prev.y+curr.y)/2+spread/2;
        ctx.quadraticCurveTo(prev.x,prev.y+spread/2,cpx,cpy);
      }
      ctx.lineTo(coords[0].x,coords[0].y+spread/2);
      ctx.closePath();

      var aGrad=ctx.createLinearGradient(0,coords[0].y-spread,0,coords[0].y+spread);
      var h=band.hue+Math.sin(t*.0003+b)*15;
      aGrad.addColorStop(0,'hsla('+h+',80%,60%,0)');
      aGrad.addColorStop(.3,'hsla('+h+',80%,55%,'+layerAlpha+')');
      aGrad.addColorStop(.5,'hsla('+h+',85%,65%,'+layerAlpha*1.2+')');
      aGrad.addColorStop(.7,'hsla('+h+',80%,55%,'+layerAlpha+')');
      aGrad.addColorStop(1,'hsla('+h+',80%,60%,0)');
      ctx.fillStyle=aGrad;
      ctx.fill();
    }

    // Bright center line
    ctx.beginPath();
    ctx.moveTo(coords[0].x,coords[0].y);
    for(var p=1;p<coords.length;p++){
      var prev=coords[p-1],curr=coords[p];
      ctx.quadraticCurveTo(prev.x,prev.y,(prev.x+curr.x)/2,(prev.y+curr.y)/2);
    }
    ctx.lineTo(coords[coords.length-1].x,coords[coords.length-1].y);
    ctx.strokeStyle='hsla('+(band.hue+10)+',90%,75%,'+pulse*band.alpha*1.5+')';
    ctx.lineWidth=1.5;
    ctx.shadowColor='hsla('+band.hue+',90%,70%,.3)';
    ctx.shadowBlur=15;
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  // Aurora reflection on snow (subtle glow at bottom)
  var refGlow=ctx.createRadialGradient(W*.5,H*.65,0,W*.5,H*.65,H*.4);
  var avgHue=140+Math.sin(t*.0003)*20;
  refGlow.addColorStop(0,'hsla('+avgHue+',60%,50%,.03)');
  refGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=refGlow;
  ctx.fillRect(0,H*.45,W,H*.55);

  // Far mountains (darker, bluish)
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3){
    ctx.lineTo(x,getMountainY(x,7,H*.68,.18));
  }
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle='#0e1520';ctx.fill();

  // Mid mountains
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3){
    ctx.lineTo(x,getMountainY(x,3,H*.72,.15));
  }
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle='#141e2a';ctx.fill();

  // Near mountains — snow-capped
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3){
    ctx.lineTo(x,getMountainY(x,0,H*.78,.14));
  }
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle='#1a2535';ctx.fill();

  // Snow caps on near mountains
  ctx.beginPath();
  for(var x=0;x<=W;x+=2){
    var my=getMountainY(x,0,H*.78,.14);
    var peakness=Math.max(0,1-(my/(H*.55)));
    if(peakness>.3){
      var snowDepth=peakness*18;
      ctx.moveTo(x,my);
      ctx.lineTo(x,my+snowDepth);
    }
  }
  ctx.strokeStyle='rgba(200,210,230,.12)';ctx.lineWidth=2;ctx.stroke();

  // Snow peaks highlights
  ctx.beginPath();
  for(var x=0;x<=W;x+=3){
    var my=getMountainY(x,0,H*.78,.14);
    var peakness=Math.max(0,1-(my/(H*.58)));
    if(peakness>.4){
      ctx.moveTo(x,my);
      ctx.lineTo(x,my+peakness*8);
    }
  }
  ctx.strokeStyle='rgba(230,235,245,.08)';ctx.lineWidth=1;ctx.stroke();

  // Snowy ground
  var groundY=H*.78;
  var gGrad=ctx.createLinearGradient(0,groundY,0,H);
  gGrad.addColorStop(0,'#1e2a3a');
  gGrad.addColorStop(.3,'#2a3548');
  gGrad.addColorStop(1,'#1a2535');
  ctx.fillStyle=gGrad;
  ctx.fillRect(0,groundY,W,H-groundY);

  // Snow surface texture
  for(var x=0;x<W;x+=40){
    var sx=x+Math.sin(x*.05)*5;
    var sy=groundY+2+Math.sin(x*.02)*3;
    ctx.beginPath();
    ctx.ellipse(sx,sy,18,2,0,0,Math.PI*2);
    ctx.fillStyle='rgba(200,210,230,.04)';
    ctx.fill();
  }

  // Pine trees silhouettes
  for(var i=0;i<20;i++){
    var tx=i*(W/20)+Math.sin(i*7)*15;
    var tBase=groundY+2+Math.sin(tx*.01)*3;
    var tH=20+Math.sin(i*13)*8;
    // Trunk
    ctx.fillStyle='rgba(10,15,20,.8)';
    ctx.fillRect(tx-1.5,tBase-tH,3,tH);
    // Triangle foliage layers
    for(var l=0;l<3;l++){
      var ly=tBase-tH+l*(tH*.25);
      var lw=6+l*4;
      ctx.beginPath();
      ctx.moveTo(tx,ly-5);
      ctx.lineTo(tx-lw,ly+tH*.25);
      ctx.lineTo(tx+lw,ly+tH*.25);
      ctx.closePath();
      ctx.fillStyle='rgba(12,22,18,.85)';
      ctx.fill();
      // Snow on branches
      ctx.beginPath();
      ctx.moveTo(tx,ly-5);
      ctx.lineTo(tx-lw*.6,ly+2);
      ctx.lineTo(tx+lw*.6,ly+2);
      ctx.closePath();
      ctx.fillStyle='rgba(200,210,230,.06)';
      ctx.fill();
    }
  }

  // Snowflakes
  for(var i=0;i<snowflakes.length;i++){
    var s=snowflakes[i];
    s.y+=s.vy;
    s.x+=s.vx+Math.sin(t*.001+s.ph)*.3;
    if(s.y>H+5){s.y=-5;s.x=Math.random()*W;}
    if(s.x>W+5)s.x=-5;
    if(s.x<-5)s.x=W+5;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(220,230,245,'+s.a*(0.5+.3*Math.sin(t*.001+s.ph))+')';
    ctx.fill();
  }
}

/* ── INIT & LOOP ── */
function initAll(){
  initCity();
  initSea();
  initAurora();
}
resize();
window.addEventListener('resize',resize);

function loop(time){
  requestAnimationFrame(loop);

  if(target==='happy') drawCity(time);
  else if(target==='sad') drawSea(time);
  else drawAurora(time);

  if(target!==current){
    transA+=.025;
    if(transA>=1){current=target;transA=0;}
  }
  if(transA>0&&transA<1){
    ctx.fillStyle='rgba(0,0,0,'+Math.sin(transA*Math.PI)*.6+')';
    ctx.fillRect(0,0,W,H);
  }
}

requestAnimationFrame(loop);
})();
</script>
</body>
