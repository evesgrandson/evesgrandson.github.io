<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poems — Aether</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;background:#060810;font-family:'Rajdhani',sans-serif;color:#fff}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}
.page{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 80px;
}
h1{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:30px;letter-spacing:3px;
  margin-bottom:4px;
  background:linear-gradient(135deg,#6ee7ff,#a78bfa,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{
  font-size:13px;color:rgba(255,255,255,.4);margin-bottom:36px;letter-spacing:1.5px;
  text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.poem-card{
  width:100%;max-width:620px;max-height:70vh;overflow-y:auto;
  background:rgba(8,8,20,.55);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;padding:44px 38px 40px;
  box-shadow:0 0 80px rgba(0,0,0,.25);
  text-align:center;position:relative;
  margin-bottom:20px;
  transition:border-color .5s;
  scrollbar-width:thin;scrollbar-color:rgba(167,139,250,.2) transparent;
}
.poem-card::-webkit-scrollbar{width:4px}
.poem-card::-webkit-scrollbar-thumb{background:rgba(167,139,250,.2);border-radius:2px}
.poem-card:hover{border-color:rgba(167,139,250,.15)}
.poem-card::before,.poem-card::after{
  content:'';position:absolute;width:36px;height:36px;
  border-color:rgba(167,139,250,.12);border-style:solid;
}
.poem-card::before{top:14px;left:14px;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
.poem-card::after{bottom:14px;right:14px;border-width:0 2px 2px 0;border-radius:0 0 4px 0}
.poem-title{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;font-weight:600;
  color:rgba(255,255,255,.85);margin-bottom:20px;
  opacity:1;transition:opacity .6s ease;
}
.poem-title.fade-out{opacity:0}
.poem-body{
  font-family:'Cormorant Garamond',serif;
  font-size:19px;font-weight:400;font-style:italic;
  line-height:2;color:rgba(255,255,255,.78);
  white-space:pre-line;
  opacity:1;transition:opacity .6s ease;
}
.poem-body.fade-out{opacity:0}
.poem-author{
  font-family:'Rajdhani',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:rgba(167,139,250,.5);
  margin-top:24px;
  opacity:1;transition:opacity .6s ease;
}
.poem-author.fade-out{opacity:0}
.poem-meta{
  font-family:'Rajdhani',sans-serif;
  font-size:11px;color:rgba(255,255,255,.18);
  margin-top:8px;letter-spacing:1px;
  opacity:1;transition:opacity .6s ease;
}
.poem-meta.fade-out{opacity:0}
.fetch-btn{
  padding:14px 40px;border-radius:14px;
  border:1px solid rgba(167,139,250,.25);
  background:linear-gradient(135deg,rgba(110,80,255,.18),rgba(244,114,182,.12));
  color:rgba(255,255,255,.75);
  font:700 15px 'Rajdhani',sans-serif;letter-spacing:1.5px;
  cursor:pointer;transition:all .35s ease;
}
.fetch-btn:hover{
  background:linear-gradient(135deg,rgba(110,80,255,.35),rgba(244,114,182,.25));
  color:#fff;transform:scale(1.03);
  box-shadow:0 0 30px rgba(167,139,250,.15);
  border-color:rgba(167,139,250,.4);
}
.fetch-btn:active{transform:scale(.97)}
.fetch-btn.loading{pointer-events:none;opacity:.5}
.fetch-btn .spinner{
  display:none;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(167,139,250,.7);
  border-radius:50%;animation:spin .6s linear infinite;
  margin-right:8px;vertical-align:middle;
}
.fetch-btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.counter{
  margin-top:14px;font-size:11px;color:rgba(255,255,255,.15);
  letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.4);
}
.error-msg{
  font:400 14px 'Rajdhani',sans-serif;
  color:rgba(248,113,113,.6);margin-top:12px;
  opacity:0;transition:opacity .4s;
}
.error-msg.visible{opacity:1}
.backlink{
  position:fixed;bottom:12px;left:16px;z-index:9999;
  color:rgba(255,255,255,.45);font:600 13px 'Rajdhani',sans-serif;
  text-decoration:none;letter-spacing:.5px;transition:color .3s;
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.backlink:hover{color:#fff}
@media(max-width:480px){
  .poem-card{padding:32px 22px 30px}
  .poem-title{font-size:22px}
  .poem-body{font-size:16px;line-height:1.9}
  h1{font-size:24px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="page">
  <h1>POEMS</h1>
  <div class="subtitle">ink that bleeds louder than words</div>

  <div class="poem-card" id="poemCard">
    <div class="poem-title" id="poemTitle">Summoning a poem…</div>
    <div class="poem-body" id="poemBody"></div>
    <div class="poem-author" id="poemAuthor"></div>
    <div class="poem-meta" id="poemMeta"></div>
  </div>

  <button class="fetch-btn" id="fetchBtn">
    <span class="spinner"></span>
    <span class="btn-label">ANOTHER POEM</span>
  </button>

  <div class="error-msg" id="errorMsg">Could not reach the poetry archive. Try again.</div>
  <div class="counter" id="counter"></div>
</div>

<a class="backlink" href="index.html">&larr; home</a>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════
   API CONFIGURATION
   PoetryDB — free, no key needed, no CORS issues.
   Docs: https://poetrydb.org/

   Other endpoints you can try:
     Random poem:          https://poetrydb.org/random
     Random Shakespeare:   https://poetrydb.org/author/Shakespeare/random
     Random by title word: https://poetrydb.org/title,random/Love;1
     Random by line count: https://poetrydb.org/linecount/14/random
   ══════════════════════════════════════════════════════ */

var POEM_API_URL = 'https://poetrydb.org/random';

/* ══════════════════════════════════════════════════════ */

var poemTitle = document.getElementById('poemTitle');
var poemBody = document.getElementById('poemBody');
var poemAuthor = document.getElementById('poemAuthor');
var poemMeta = document.getElementById('poemMeta');
var fetchBtn = document.getElementById('fetchBtn');
var errorMsg = document.getElementById('errorMsg');
var counterEl = document.getElementById('counter');
var fetchCount = 0;

function fadeOut(cb){
  poemTitle.classList.add('fade-out');
  poemBody.classList.add('fade-out');
  poemAuthor.classList.add('fade-out');
  poemMeta.classList.add('fade-out');
  setTimeout(cb, 500);
}

function fadeIn(){
  poemTitle.classList.remove('fade-out');
  poemBody.classList.remove('fade-out');
  poemAuthor.classList.remove('fade-out');
  poemMeta.classList.remove('fade-out');
}

function fetchPoem(){
  fetchBtn.classList.add('loading');
  errorMsg.classList.remove('visible');

  var ctrl = new AbortController();
  var timeout = setTimeout(function(){ ctrl.abort(); }, 6000);

  fetch(POEM_API_URL, { signal: ctrl.signal })
    .then(function(res){
      clearTimeout(timeout);
      if(!res.ok) throw new Error('API returned ' + res.status);
      return res.json();
    })
    .then(function(data){
      var p = Array.isArray(data) ? data[0] : data;
      if(!p || !p.title || !p.lines) throw new Error('Unexpected format');

      fadeOut(function(){
        poemTitle.textContent = p.title;

        var lines = p.lines;
        if(lines.length > 48){
          lines = lines.slice(0, 48);
          lines.push('\n[… ' + p.linecount + ' lines total — this is an excerpt]');
        }
        poemBody.textContent = lines.join('\n');
        poemAuthor.textContent = '— ' + p.author;

        var meta = [];
        if(p.year) meta.push(p.year);
        if(p.linecount) meta.push(p.linecount + ' lines');
        poemMeta.textContent = meta.join(' · ');

        document.getElementById('poemCard').scrollTop = 0;
        fadeIn();
      });

      fetchCount++;
      counterEl.textContent = fetchCount + ' poem' + (fetchCount > 1 ? 's' : '') + ' summoned';
    })
    .catch(function(err){
      clearTimeout(timeout);
      errorMsg.classList.add('visible');
      if(fetchCount === 0){
        poemTitle.textContent = 'The archive is silent.';
        poemBody.textContent = 'Press the button to try again.';
      }
    })
    .finally(function(){
      fetchBtn.classList.remove('loading');
    });
}

fetchBtn.addEventListener('click', fetchPoem);

document.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){
    if(document.activeElement === fetchBtn || document.activeElement === document.body){
      e.preventDefault();
      fetchPoem();
    }
  }
});

// Fetch first poem on load
fetchPoem();

/* ══════════════════════════════════════════════════════
   CANVAS — Storm ↔ Calm Ocean Cycle
   ══════════════════════════════════════════════════════ */

var C = document.getElementById('bg');
var ctx = C.getContext('2d');
var W, H, dpr = Math.min(window.devicePixelRatio||1, 2);
var CYCLE_MS = 60000;

var waves=[], raindrops=[], foam=[], debris=[];
var lightningFlash=0, lightningBolts=[], lastLightning=0;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  C.width=W*dpr; C.height=H*dpr;
  C.style.width=W+'px'; C.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initOcean();
}

function initOcean(){
  waves=[];
  for(var i=0;i<10;i++) waves.push({baseY:H*.4+i*H*.06,amp:6+i*2.5,freq:.006-i*.0003,speed:.0006+i*.00015,phase:Math.random()*Math.PI*2,baseAlpha:.12+i*.05});
  raindrops=[];
  for(var i=0;i<250;i++) raindrops.push({x:Math.random()*W*1.3-W*.15,y:Math.random()*H,len:8+Math.random()*18,speed:12+Math.random()*10,alpha:Math.random()*.3+.15});
  foam=[];
  for(var i=0;i<40;i++) foam.push({x:Math.random()*W,y:H*.38+Math.random()*H*.12,r:Math.random()*3+1,phase:Math.random()*Math.PI*2});
  debris=[];
  for(var i=0;i<15;i++) debris.push({x:Math.random()*W,y:H*.35+Math.random()*H*.1,vx:(Math.random()-.5)*2,phase:Math.random()*Math.PI*2,size:1+Math.random()*2});
}

function lerp(a,b,t){return a+(b-a)*t;}
function lerpC(c1,c2,t){return[Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))];}
function rgb(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')';}
function rgba(c,a){return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function smoothStep(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}

function getStormIntensity(time){
  var phase=(time%CYCLE_MS)/CYCLE_MS;
  if(phase<.1) return smoothStep(phase/.1);
  if(phase<.45) return 1;
  if(phase<.55) return 1-smoothStep((phase-.45)/.1);
  if(phase<.95) return 0;
  return smoothStep((phase-.95)/.05);
}

function spawnLightning(time,storm){
  if(storm<.5) return;
  if(time-lastLightning<800+Math.random()*3000/storm) return;
  if(Math.random()>storm*.04) return;
  lastLightning=time; lightningFlash=1;
  var bolt=[],x=W*.15+Math.random()*W*.7,y=0,segs=8+Math.floor(Math.random()*8);
  for(var i=0;i<segs;i++){
    var nx=x+(Math.random()-.5)*60,ny=y+H*.04+Math.random()*H*.05;
    bolt.push({x1:x,y1:y,x2:nx,y2:ny});
    if(Math.random()>.6&&i>1){var bx=nx+(Math.random()-.5)*80,by=ny+H*.03+Math.random()*H*.04;bolt.push({x1:nx,y1:ny,x2:bx,y2:by,branch:true});}
    x=nx;y=ny;if(y>H*.38) break;
  }
  lightningBolts.push({segments:bolt,life:1,decay:.04+Math.random()*.02});
}

function drawScene(time){
  var storm=getStormIntensity(time),calm=1-storm;
  var skyTop=lerpC([15,25,60],[12,14,22],storm);
  var skyMid=lerpC([40,65,120],[18,20,32],storm);
  var skyLow=lerpC([70,100,155],[25,28,40],storm);
  var skyG=ctx.createLinearGradient(0,0,0,H*.42);
  skyG.addColorStop(0,rgb(skyTop));skyG.addColorStop(.5,rgb(skyMid));skyG.addColorStop(1,rgb(skyLow));
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);

  if(storm>.05){
    for(var layer=0;layer<3;layer++){
      var cy=H*.02+layer*H*.06,speed=(.015+layer*.008)*storm;
      var cloudDark=lerpC([30,33,45],[15,17,25],storm);
      for(var i=0;i<6;i++){
        var cx=((time*speed+i*W/6+layer*100)%(W+300))-150;
        var cw=120+layer*40+Math.sin(i*5)*30,ch=30+layer*12,ca=storm*(.4+layer*.15);
        ctx.fillStyle=rgba(cloudDark,ca);
        ctx.beginPath();ctx.ellipse(cx,cy,cw/2,ch/2,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(cx-cw*.2,cy+ch*.2,cw*.35,ch*.35,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(cx+cw*.25,cy-ch*.1,cw*.3,ch*.4,0,0,Math.PI*2);ctx.fill();
        if(lightningFlash>.1){ctx.beginPath();ctx.ellipse(cx,cy+ch*.3,cw*.4,ch*.25,0,0,Math.PI*2);ctx.fillStyle=rgba([180,190,220],lightningFlash*.08);ctx.fill();}
      }
    }
  }

  if(calm>.3){
    var starA=(calm-.3)/.7;
    for(var i=0;i<60;i++){var sx=(i*137.5)%W,sy=(i*97.3)%(H*.3),sa=starA*(.2+.4*Math.sin(time*.001+i*2.7));ctx.beginPath();ctx.arc(sx,sy,.8,0,Math.PI*2);ctx.fillStyle='rgba(220,230,255,'+sa+')';ctx.fill();}
  }

  if(calm>.2){
    var moonA=Math.min(1,(calm-.2)/.5)*.8,mx=W*.78,my=H*.1;
    ctx.beginPath();ctx.arc(mx,my,50,0,Math.PI*2);ctx.fillStyle=rgba([150,170,200],moonA*.03);ctx.fill();
    ctx.beginPath();ctx.arc(mx,my,30,0,Math.PI*2);ctx.fillStyle=rgba([150,170,200],moonA*.05);ctx.fill();
    ctx.beginPath();ctx.arc(mx,my,16,0,Math.PI*2);ctx.fillStyle=rgba([215,225,240],moonA);ctx.fill();
    ctx.beginPath();ctx.arc(mx+5,my-2,13,0,Math.PI*2);ctx.fillStyle=rgba(skyTop,moonA*.8);ctx.fill();
    if(calm>.5){var refA=(calm-.5)*.6;for(var i=0;i<12;i++){var ry=H*.42+i*6,rw=14-i*.5+Math.sin(time*.001+i)*2;ctx.fillStyle=rgba([180,200,225],refA*(.04-i*.002));ctx.fillRect(mx-rw/2+Math.sin(time*.0008+i*.4)*3,ry,rw,2);}}
  }

  ctx.fillStyle=rgb(lerpC([8,20,50],[6,10,20],storm));ctx.fillRect(0,H*.4,W,H*.6);

  var waveTurb=lerp(1,3.5,storm),waveSpd=lerp(1,2.2,storm);
  for(var i=0;i<waves.length;i++){
    var w=waves[i],amp=w.amp*waveTurb;
    var waveCol=i<3?lerpC([35,75,135],[20,35,60],storm):(i<6?lerpC([25,55,105],[15,25,50],storm):lerpC([15,35,75],[10,18,35],storm));
    ctx.beginPath();ctx.moveTo(0,H);
    for(var x=0;x<=W;x+=3){var y=w.baseY+Math.sin(x*w.freq+time*w.speed*waveSpd+w.phase)*amp+Math.sin(x*w.freq*2.1+time*w.speed*1.6*waveSpd+w.phase*1.3)*amp*.35+Math.sin(x*w.freq*.5+time*w.speed*.7*waveSpd)*amp*.5*storm;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=rgba(waveCol,w.baseAlpha+storm*.08);ctx.fill();
  }

  var crestCount=Math.floor(lerp(3,15,storm));
  for(var i=0;i<crestCount;i++){var cx=(time*.03*(i+1)*.7+i*W/crestCount)%W,cy=H*.4+i*H*.04+Math.sin(time*.001+i*3)*8*waveTurb,cw=15+Math.random()*20+storm*15,ca=(.1+storm*.25)*Math.abs(Math.sin(time*.002+i*2));ctx.beginPath();ctx.moveTo(cx-cw/2,cy);ctx.quadraticCurveTo(cx,cy-3-storm*4,cx+cw/2,cy);ctx.strokeStyle=rgba([200,220,240],ca);ctx.lineWidth=1.5;ctx.stroke();}

  for(var i=0;i<foam.length;i++){var f=foam[i],fx=f.x+Math.sin(time*.001+f.phase)*5*waveTurb,fy=f.y+Math.sin(time*.002+f.phase)*4*waveTurb,fa=(.1+storm*.2)*(.3+.5*Math.sin(time*.002+f.phase));ctx.beginPath();ctx.arc(fx,fy,f.r*(1+storm*.5),0,Math.PI*2);ctx.fillStyle=rgba([180,210,235],Math.max(0,fa));ctx.fill();}

  if(storm>.3){for(var i=0;i<20;i++){var sx=(time*.05+i*73)%W,sy=H*.36+Math.sin(time*.002+i)*H*.05+Math.random()*5;ctx.beginPath();ctx.arc(sx,sy,1+Math.random()*2,0,Math.PI*2);ctx.fillStyle=rgba([200,215,230],(storm-.3)*.5*(.2+Math.random()*.3));ctx.fill();}}

  if(storm>.4){for(var i=0;i<debris.length;i++){var d=debris[i];d.x+=d.vx*storm;if(d.x>W+10)d.x=-10;if(d.x<-10)d.x=W+10;ctx.fillStyle=rgba([80,70,60],(storm-.4)/.6*.5);ctx.fillRect(d.x,d.y+Math.sin(time*.003+d.phase)*6*storm,d.size*3,d.size);}}

  if(storm>.1){for(var i=0;i<raindrops.length;i++){var r=raindrops[i];r.y+=r.speed*storm;r.x+=3*storm+storm*.25*r.speed*.5;if(r.y>H+10){r.y=-20;r.x=Math.random()*W*1.3-W*.15;}if(r.x>W+20)r.x=-20;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-storm*.25*r.len*storm*.3,r.y-r.len*storm);ctx.strokeStyle=rgba([180,200,220],r.alpha*storm);ctx.lineWidth=.8;ctx.stroke();}}

  spawnLightning(time,storm);
  if(lightningFlash>0){lightningFlash*=.92;if(lightningFlash<.01)lightningFlash=0;ctx.fillStyle=rgba([220,225,240],lightningFlash*.15);ctx.fillRect(0,0,W,H);}
  for(var b=lightningBolts.length-1;b>=0;b--){var bolt=lightningBolts[b];bolt.life-=bolt.decay;if(bolt.life<=0){lightningBolts.splice(b,1);continue;}for(var s=0;s<bolt.segments.length;s++){var seg=bolt.segments[s];ctx.beginPath();ctx.moveTo(seg.x1,seg.y1);ctx.lineTo(seg.x2,seg.y2);if(seg.branch){ctx.strokeStyle=rgba([180,190,255],bolt.life*.4);ctx.lineWidth=1;}else{ctx.strokeStyle=rgba([230,235,255],bolt.life*.8);ctx.lineWidth=2;ctx.shadowColor='rgba(180,190,255,'+bolt.life*.5+')';ctx.shadowBlur=15;}ctx.stroke();ctx.shadowBlur=0;}}

  if(calm>.3){var refA=(calm-.3)/.7;var refG=ctx.createLinearGradient(0,H*.4,0,H*.55);refG.addColorStop(0,rgba(skyLow,refA*.08));refG.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=refG;ctx.fillRect(0,H*.4,W,H*.15);for(var i=0;i<25;i++){var sx=(i*W/25)+Math.sin(time*.0005+i)*20,sy=H*.42+i*3+Math.sin(time*.001+i*2)*3,sa=refA*.12*(.3+.7*Math.sin(time*.002+i*3.7));ctx.fillStyle=rgba([200,220,250],sa);ctx.fillRect(sx,sy,3+Math.random()*2,1);}}

  var fogA=lerp(.01,.06,storm),fogCol=lerpC([100,110,130],[40,45,55],storm);
  var fogG=ctx.createLinearGradient(0,H*.3,0,H*.5);fogG.addColorStop(0,rgba(fogCol,0));fogG.addColorStop(.5,rgba(fogCol,fogA));fogG.addColorStop(1,rgba(fogCol,0));ctx.fillStyle=fogG;ctx.fillRect(0,H*.3,W,H*.2);
}

resize();
window.addEventListener('resize',resize);
function loop(t){requestAnimationFrame(loop);drawScene(t);}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
