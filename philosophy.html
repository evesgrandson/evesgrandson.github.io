<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philosophy — Aether</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;background:#0a0a12;font-family:'Rajdhani',sans-serif;color:#fff}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}
.page{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 80px;
}
h1{
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:30px;letter-spacing:3px;
  margin-bottom:4px;
  background:linear-gradient(135deg,#6ee7ff,#a78bfa,#f472b6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;
}
.subtitle{
  font-size:13px;color:rgba(255,255,255,.4);margin-bottom:40px;letter-spacing:1.5px;
  text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.quote-card{
  width:100%;max-width:600px;min-height:260px;
  background:rgba(12,12,28,.5);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.07);
  border-radius:22px;padding:48px 36px 40px;
  box-shadow:0 0 80px rgba(0,0,0,.2),0 0 2px rgba(167,139,250,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
  transition:border-color .5s;
}
.quote-card:hover{border-color:rgba(167,139,250,.18)}
.quote-card::before,.quote-card::after{
  content:'';position:absolute;width:40px;height:40px;
  border-color:rgba(167,139,250,.15);border-style:solid;
}
.quote-card::before{top:16px;left:16px;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
.quote-card::after{bottom:16px;right:16px;border-width:0 2px 2px 0;border-radius:0 0 4px 0}
.quote-mark{
  font-family:'Cormorant Garamond',serif;font-size:72px;line-height:1;
  color:rgba(167,139,250,.2);margin-bottom:-10px;user-select:none;
}
.quote-text{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:400;font-style:italic;
  line-height:1.7;color:rgba(255,255,255,.88);
  margin-bottom:20px;
  opacity:1;transition:opacity .5s ease;
}
.quote-text.fade-out{opacity:0}
.quote-author{
  font-family:'Rajdhani',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;color:rgba(167,139,250,.6);
  opacity:1;transition:opacity .5s ease;
}
.quote-author.fade-out{opacity:0}
.quote-source{
  font-family:'Rajdhani',sans-serif;
  font-size:11px;color:rgba(255,255,255,.2);
  margin-top:4px;letter-spacing:1px;
  opacity:1;transition:opacity .5s ease;
}
.quote-source.fade-out{opacity:0}
.fetch-btn{
  margin-top:36px;padding:14px 40px;border-radius:14px;
  border:1px solid rgba(167,139,250,.25);
  background:linear-gradient(135deg,rgba(110,80,255,.18),rgba(244,114,182,.12));
  color:rgba(255,255,255,.75);
  font:700 15px 'Rajdhani',sans-serif;letter-spacing:1.5px;
  cursor:pointer;transition:all .35s ease;
}
.fetch-btn:hover{
  background:linear-gradient(135deg,rgba(110,80,255,.35),rgba(244,114,182,.25));
  color:#fff;transform:scale(1.03);
  box-shadow:0 0 30px rgba(167,139,250,.15);
  border-color:rgba(167,139,250,.4);
}
.fetch-btn:active{transform:scale(0.97)}
.fetch-btn.loading{pointer-events:none;opacity:.5}
.fetch-btn .spinner{
  display:none;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:rgba(167,139,250,.7);
  border-radius:50%;animation:spin .6s linear infinite;
  margin-right:8px;vertical-align:middle;
}
.fetch-btn.loading .spinner{display:inline-block}
.fetch-btn.loading .btn-label{opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.counter{margin-top:16px;font-size:11px;color:rgba(255,255,255,.18);letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.backlink{
  position:fixed;bottom:12px;left:16px;z-index:9999;
  color:rgba(255,255,255,.45);font:600 13px 'Rajdhani',sans-serif;
  text-decoration:none;letter-spacing:.5px;transition:color .3s;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.backlink:hover{color:#fff}
@media(max-width:480px){
  .quote-card{padding:36px 24px 32px;min-height:220px}
  .quote-text{font-size:18px}
  .quote-mark{font-size:56px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="page">
  <h1>PHILOSOPHY</h1>
  <div class="subtitle">words that outlived their speakers</div>

  <div class="quote-card">
    <div class="quote-mark">&ldquo;</div>
    <div class="quote-text" id="quoteText">Click the button to summon a thought from the void.</div>
    <div class="quote-author" id="quoteAuthor"></div>
    <div class="quote-source" id="quoteSource"></div>
  </div>

  <button class="fetch-btn" id="fetchBtn">
    <span class="spinner"></span>
    <span class="btn-label">SEEK WISDOM</span>
  </button>

  <div class="counter" id="counter"></div>
</div>

<a class="backlink" href="index.html">&larr; home</a>

<script>
(function(){
"use strict";

/* ── QUOTES ── */
var LOCAL_QUOTES = [
  {text:"The unexamined life is not worth living.",author:"Socrates",source:"Apology, 38a"},
  {text:"I think, therefore I am.",author:"René Descartes",source:"Discourse on the Method, 1637"},
  {text:"One cannot step into the same river twice.",author:"Heraclitus",source:"Fragments"},
  {text:"Man is condemned to be free; because once thrown into the world, he is responsible for everything he does.",author:"Jean-Paul Sartre",source:"Being and Nothingness, 1943"},
  {text:"The only true wisdom is in knowing you know nothing.",author:"Socrates",source:"attributed by Plato"},
  {text:"He who has a why to live for can bear almost any how.",author:"Friedrich Nietzsche",source:"Twilight of the Idols, 1889"},
  {text:"Happiness depends upon ourselves.",author:"Aristotle",source:"Nicomachean Ethics"},
  {text:"The mind is everything. What you think you become.",author:"Buddha",source:"Dhammapada"},
  {text:"To be is to be perceived.",author:"George Berkeley",source:"A Treatise Concerning the Principles of Human Knowledge, 1710"},
  {text:"The life of man is solitary, poor, nasty, brutish, and short.",author:"Thomas Hobbes",source:"Leviathan, 1651"},
  {text:"Man is born free, and everywhere he is in chains.",author:"Jean-Jacques Rousseau",source:"The Social Contract, 1762"},
  {text:"God is dead. God remains dead. And we have killed him.",author:"Friedrich Nietzsche",source:"The Gay Science, 1882"},
  {text:"Act only according to that maxim whereby you can at the same time will that it should become a universal law.",author:"Immanuel Kant",source:"Groundwork of the Metaphysics of Morals, 1785"},
  {text:"That which does not kill us makes us stronger.",author:"Friedrich Nietzsche",source:"Twilight of the Idols, 1888"},
  {text:"We are what we repeatedly do. Excellence, then, is not an act, but a habit.",author:"Aristotle",source:"attributed by Will Durant"},
  {text:"The heart has its reasons which reason knows nothing of.",author:"Blaise Pascal",source:"Pensées, 1670"},
  {text:"He who fears he shall suffer, already suffers what he fears.",author:"Michel de Montaigne",source:"Essays, 1580"},
  {text:"The soul becomes dyed with the colour of its thoughts.",author:"Marcus Aurelius",source:"Meditations, Book V"},
  {text:"Waste no more time arguing about what a good man should be. Be one.",author:"Marcus Aurelius",source:"Meditations, Book X"},
  {text:"It is not death that a man should fear, but he should fear never beginning to live.",author:"Marcus Aurelius",source:"Meditations"},
  {text:"Knowing yourself is the beginning of all wisdom.",author:"Aristotle",source:"attributed"},
  {text:"The only way to deal with an unfree world is to become so absolutely free that your very existence is an act of rebellion.",author:"Albert Camus",source:"attributed"},
  {text:"One must imagine Sisyphus happy.",author:"Albert Camus",source:"The Myth of Sisyphus, 1942"},
  {text:"Whereof one cannot speak, thereof one must be silent.",author:"Ludwig Wittgenstein",source:"Tractatus Logico-Philosophicus, 1921"},
  {text:"The limits of my language mean the limits of my world.",author:"Ludwig Wittgenstein",source:"Tractatus Logico-Philosophicus, 1921"},
  {text:"Hell is other people.",author:"Jean-Paul Sartre",source:"No Exit, 1944"},
  {text:"Existence precedes essence.",author:"Jean-Paul Sartre",source:"Existentialism Is a Humanism, 1946"},
  {text:"Do not spoil what you have by desiring what you have not.",author:"Epicurus",source:"Letter to Menoeceus"},
  {text:"We suffer more often in imagination than in reality.",author:"Seneca",source:"Letters from a Stoic, c. 65 AD"},
  {text:"It is not that we have a short time to live, but that we waste a great deal of it.",author:"Seneca",source:"On the Shortness of Life, 49 AD"},
  {text:"The whole future lies in uncertainty: live immediately.",author:"Seneca",source:"On the Shortness of Life"}
];

var API_URL = 'https://api.quotable.io/quotes/random?tags=philosophy|wisdom|history|truth';

var quoteText=document.getElementById('quoteText');
var quoteAuthor=document.getElementById('quoteAuthor');
var quoteSource=document.getElementById('quoteSource');
var fetchBtn=document.getElementById('fetchBtn');
var counterEl=document.getElementById('counter');
var fetchCount=0, usedLocal=[];

function displayQuote(text,author,source){
  quoteText.classList.add('fade-out');
  quoteAuthor.classList.add('fade-out');
  quoteSource.classList.add('fade-out');
  setTimeout(function(){
    quoteText.textContent=text;
    quoteAuthor.textContent='— '+author;
    quoteSource.textContent=source||'';
    quoteText.classList.remove('fade-out');
    quoteAuthor.classList.remove('fade-out');
    quoteSource.classList.remove('fade-out');
  },450);
}

function getRandomLocal(){
  if(usedLocal.length>=LOCAL_QUOTES.length) usedLocal=[];
  var avail=[];
  for(var i=0;i<LOCAL_QUOTES.length;i++) if(usedLocal.indexOf(i)===-1) avail.push(i);
  var pick=avail[Math.floor(Math.random()*avail.length)];
  usedLocal.push(pick);
  return LOCAL_QUOTES[pick];
}

function fetchQuote(){
  fetchBtn.classList.add('loading');
  var ctrl=new AbortController();
  var tout=setTimeout(function(){ctrl.abort();},4000);
  fetch(API_URL,{signal:ctrl.signal})
    .then(function(r){clearTimeout(tout);if(!r.ok)throw 0;return r.json();})
    .then(function(d){var q=Array.isArray(d)?d[0]:d;if(q&&q.content&&q.author)displayQuote(q.content,q.author,q.tags?q.tags.join(', '):'');else throw 0;})
    .catch(function(){clearTimeout(tout);var q=getRandomLocal();displayQuote(q.text,q.author,q.source);})
    .finally(function(){fetchBtn.classList.remove('loading');fetchCount++;counterEl.textContent=fetchCount+' thought'+(fetchCount>1?'s':'')+' summoned';});
}

fetchBtn.addEventListener('click',fetchQuote);

/* ══════════════════════════════════════════
   CANVAS — Day/Night Hills & Mountains
   ══════════════════════════════════════════ */
var C=document.getElementById('bg');
var ctx=C.getContext('2d');
var W,H,dpr=Math.min(window.devicePixelRatio||1,2);
var stars=[], clouds=[], birds=[];

// Full cycle duration in ms (one complete day-night)
var CYCLE_MS = 120000; // 2 minutes per full cycle

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  C.width=W*dpr; C.height=H*dpr;
  C.style.width=W+'px'; C.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initScene();
}

function initScene(){
  stars=[];
  for(var i=0;i<100;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H*0.4,
      r:Math.random()*1.3+0.2,
      phase:Math.random()*Math.PI*2,
      twinkle:Math.random()*0.003+0.001
    });
  }
  clouds=[];
  for(var i=0;i<7;i++){
    clouds.push({
      x:Math.random()*W*1.5-W*0.25,
      y:H*0.06+Math.random()*H*0.14,
      w:100+Math.random()*160,
      h:25+Math.random()*25,
      speed:0.12+Math.random()*0.2
    });
  }
  birds=[];
  for(var i=0;i<5;i++){
    birds.push({
      x:Math.random()*W,
      y:H*0.12+Math.random()*H*0.15,
      speed:0.4+Math.random()*0.4,
      wingPhase:Math.random()*Math.PI*2,
      size:3+Math.random()*3
    });
  }
}

function lerp(a,b,t){ return a+(b-a)*t; }

function lerpColor(c1,c2,t){
  return [
    Math.round(lerp(c1[0],c2[0],t)),
    Math.round(lerp(c1[1],c2[1],t)),
    Math.round(lerp(c1[2],c2[2],t))
  ];
}

function rgb(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

// Time-of-day phases: 0=midnight, 0.25=sunrise, 0.5=noon, 0.75=sunset, 1=midnight
// Each phase defines sky gradient stops
var SKY_PHASES = {
  0:    { top:[6,6,18],     mid:[10,12,30],     low:[14,16,35],     horizon:[18,20,40]  },
  0.2:  { top:[8,10,28],    mid:[20,25,55],     low:[40,35,60],     horizon:[60,40,65]  },
  0.27: { top:[30,30,70],   mid:[120,60,80],    low:[200,100,80],   horizon:[240,150,80]},
  0.32: { top:[60,100,180], mid:[140,160,210],  low:[220,180,160],  horizon:[250,200,140]},
  0.5:  { top:[80,150,240], mid:[130,190,250],  low:[180,215,250],  horizon:[210,230,245]},
  0.68: { top:[60,100,180], mid:[140,140,190],  low:[200,160,140],  horizon:[240,170,110]},
  0.75: { top:[35,30,70],   mid:[140,60,70],    low:[220,100,60],   horizon:[250,140,50]},
  0.82: { top:[15,15,40],   mid:[40,25,55],     low:[70,35,55],     horizon:[90,40,50]  },
  1:    { top:[6,6,18],     mid:[10,12,30],     low:[14,16,35],     horizon:[18,20,40]  }
};

function getSkyColors(phase){
  var keys=Object.keys(SKY_PHASES).map(Number).sort(function(a,b){return a-b;});
  var lo=keys[0], hi=keys[keys.length-1];
  for(var i=0;i<keys.length-1;i++){
    if(phase>=keys[i]&&phase<=keys[i+1]){ lo=keys[i]; hi=keys[i+1]; break; }
  }
  var t=(hi===lo)?0:(phase-lo)/(hi-lo);
  // Smooth step
  t=t*t*(3-2*t);
  var a=SKY_PHASES[lo], b=SKY_PHASES[hi];
  return {
    top:lerpColor(a.top,b.top,t),
    mid:lerpColor(a.mid,b.mid,t),
    low:lerpColor(a.low,b.low,t),
    horizon:lerpColor(a.horizon,b.horizon,t)
  };
}

// Mountain Y functions with different seeds
function mtY(x, seed, baseY, scale){
  return baseY
    - Math.abs(Math.sin(x*0.002+seed))*H*scale
    - Math.abs(Math.sin(x*0.005+seed*2.3))*H*scale*0.5
    - Math.abs(Math.sin(x*0.0013+seed*3.7))*H*scale*0.7;
}

// Hill Y — softer shapes
function hillY(x, seed, baseY, scale){
  return baseY
    - Math.sin(x*0.003+seed)*H*scale*0.5
    - Math.sin(x*0.006+seed*2)*H*scale*0.3
    - Math.sin(x*0.001+seed*4)*H*scale*0.4;
}

function drawScene(time){
  var phase = (time % CYCLE_MS) / CYCLE_MS; // 0..1
  var sky = getSkyColors(phase);

  // How much night (0=full day, 1=full night)
  var nightAmount;
  if(phase<0.22) nightAmount=1;
  else if(phase<0.35) nightAmount=1-(phase-0.22)/0.13;
  else if(phase<0.65) nightAmount=0;
  else if(phase<0.8) nightAmount=(phase-0.65)/0.15;
  else nightAmount=1;
  nightAmount=Math.max(0,Math.min(1,nightAmount));

  // Sky gradient
  var g=ctx.createLinearGradient(0,0,0,H*0.6);
  g.addColorStop(0,rgb(sky.top));
  g.addColorStop(0.35,rgb(sky.mid));
  g.addColorStop(0.7,rgb(sky.low));
  g.addColorStop(1,rgb(sky.horizon));
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // Stars — fade with night
  if(nightAmount>0.1){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var a=nightAmount*(0.3+0.5*Math.sin(time*s.twinkle+s.phase));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(230,235,255,'+a+')';
      ctx.fill();
    }
  }

  // Moon (visible at night)
  if(nightAmount>0.2){
    var moonPhase=phase<0.5?phase/0.5:(1-phase)/0.5;
    var moonX=W*0.15+W*0.7*(phase<0.5?(0.5-phase)*2:(phase-0.5)*2);
    var moonY=H*0.08+H*0.12*Math.sin(moonPhase*Math.PI);
    var moonA=nightAmount*0.85;
    // Glow
    ctx.beginPath(); ctx.arc(moonX,moonY,45,0,Math.PI*2);
    ctx.fillStyle=rgba([180,200,230],moonA*0.04); ctx.fill();
    ctx.beginPath(); ctx.arc(moonX,moonY,30,0,Math.PI*2);
    ctx.fillStyle=rgba([180,200,230],moonA*0.06); ctx.fill();
    // Body
    ctx.beginPath(); ctx.arc(moonX,moonY,18,0,Math.PI*2);
    ctx.fillStyle=rgba([220,230,245],moonA); ctx.fill();
    // Crescent shadow
    ctx.beginPath(); ctx.arc(moonX+6,moonY-2,15,0,Math.PI*2);
    ctx.fillStyle=rgba(sky.top,moonA*0.7); ctx.fill();
    // Moonlight on landscape
    var mlg=ctx.createRadialGradient(moonX,moonY,0,moonX,moonY,H*0.7);
    mlg.addColorStop(0,rgba([150,170,210],nightAmount*0.025));
    mlg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mlg; ctx.fillRect(0,0,W,H);
  }

  // Sun (visible during day)
  if(nightAmount<0.8){
    var sunProgress;
    if(phase<0.25) sunProgress=0;
    else if(phase<0.75) sunProgress=(phase-0.25)/0.5;
    else sunProgress=1;
    var sunX=W*(-0.05)+W*1.1*sunProgress;
    var sunY=H*0.35-Math.sin(sunProgress*Math.PI)*H*0.3;
    var sunA=(1-nightAmount)*0.9;
    // Rays
    ctx.beginPath(); ctx.arc(sunX,sunY,60,0,Math.PI*2);
    ctx.fillStyle=rgba([255,230,160],sunA*0.03); ctx.fill();
    ctx.beginPath(); ctx.arc(sunX,sunY,40,0,Math.PI*2);
    ctx.fillStyle=rgba([255,220,140],sunA*0.06); ctx.fill();
    // Body
    ctx.beginPath(); ctx.arc(sunX,sunY,16,0,Math.PI*2);
    ctx.fillStyle=rgba([255,240,200],sunA); ctx.fill();
    // Warm glow on landscape
    var slg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,H*0.8);
    slg.addColorStop(0,rgba([255,200,100],(1-nightAmount)*0.03));
    slg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=slg; ctx.fillRect(0,0,W,H);
  }

  // Clouds
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    c.x+=c.speed;
    if(c.x>W+c.w) c.x=-c.w*1.5;
    var dayBright=1-nightAmount;
    var ca=0.12*dayBright+0.04*nightAmount;
    var cc=nightAmount>0.5?[60,70,90]:[240,240,245];
    ctx.fillStyle=rgba(cc,ca);
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w/2,c.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x-c.w*0.22,c.y+4,c.w*0.3,c.h*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+c.w*0.2,c.y-2,c.w*0.35,c.h*0.45,0,0,Math.PI*2); ctx.fill();
  }

  // Birds (only during day/dusk)
  if(nightAmount<0.7){
    var ba=(1-nightAmount)*0.5;
    for(var i=0;i<birds.length;i++){
      var b=birds[i];
      b.x+=b.speed;
      if(b.x>W+30) b.x=-30;
      var wing=Math.sin(time*0.008+b.wingPhase)*b.size;
      ctx.strokeStyle=rgba([40,35,30],ba);
      ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(b.x-b.size,b.y+wing*0.7);
      ctx.quadraticCurveTo(b.x-b.size*0.3,b.y-Math.abs(wing),b.x,b.y);
      ctx.quadraticCurveTo(b.x+b.size*0.3,b.y-Math.abs(wing),b.x+b.size,b.y+wing*0.7);
      ctx.stroke();
    }
  }

  // ── MOUNTAINS (far) ──
  var mtDark=nightAmount;
  // Far range
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3) ctx.lineTo(x,mtY(x,5,H*0.58,0.2));
  ctx.lineTo(W,H); ctx.closePath();
  var farCol=lerpColor([70,90,130],[15,18,30],mtDark);
  ctx.fillStyle=rgb(farCol); ctx.fill();
  // Snow caps far
  for(var x=0;x<=W;x+=2){
    var my=mtY(x,5,H*0.58,0.2);
    var pk=Math.max(0,1-my/(H*0.38));
    if(pk>0.35){
      ctx.fillStyle=rgba([220,225,235],(0.15+pk*0.15)*(0.4+0.6*(1-mtDark)));
      ctx.fillRect(x,my,2,pk*10);
    }
  }

  // Mid range
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3) ctx.lineTo(x,mtY(x,2,H*0.64,0.16));
  ctx.lineTo(W,H); ctx.closePath();
  var midCol=lerpColor([55,75,100],[12,15,25],mtDark);
  ctx.fillStyle=rgb(midCol); ctx.fill();
  // Snow caps mid
  for(var x=0;x<=W;x+=2){
    var my=mtY(x,2,H*0.64,0.16);
    var pk=Math.max(0,1-my/(H*0.48));
    if(pk>0.3){
      ctx.fillStyle=rgba([210,215,225],(0.12+pk*0.12)*(0.4+0.6*(1-mtDark)));
      ctx.fillRect(x,my,2,pk*8);
    }
  }

  // ── HILLS (near) ──
  // Hill layer 1
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3) ctx.lineTo(x,hillY(x,0,H*0.72,0.1));
  ctx.lineTo(W,H); ctx.closePath();
  var h1Day=[50,95,45], h1Night=[12,20,15];
  ctx.fillStyle=rgb(lerpColor(h1Day,h1Night,mtDark)); ctx.fill();

  // Hill layer 2
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3) ctx.lineTo(x,hillY(x,3,H*0.78,0.08));
  ctx.lineTo(W,H); ctx.closePath();
  var h2Day=[40,80,38], h2Night=[10,16,12];
  ctx.fillStyle=rgb(lerpColor(h2Day,h2Night,mtDark)); ctx.fill();

  // Hill layer 3 (foreground)
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=3) ctx.lineTo(x,hillY(x,7,H*0.85,0.06));
  ctx.lineTo(W,H); ctx.closePath();
  var h3Day=[32,65,30], h3Night=[8,13,10];
  ctx.fillStyle=rgb(lerpColor(h3Day,h3Night,mtDark)); ctx.fill();

  // ── Trees on hills ──
  var treeLine=H*0.78;
  for(var i=0;i<30;i++){
    var tx=i*(W/30)+Math.sin(i*11)*12;
    var tBase=hillY(tx,3,H*0.78,0.08)+2;
    var tH=14+Math.sin(i*7)*6;
    var treeCol=lerpColor([25,50,22],[6,12,8],mtDark);
    // Trunk
    ctx.fillStyle=rgba(lerpColor([50,35,25],[15,10,8],mtDark),0.8);
    ctx.fillRect(tx-1,tBase-tH*0.4,2,tH*0.4);
    // Foliage
    for(var l=0;l<3;l++){
      var ly=tBase-tH+l*(tH*0.28);
      var lw=5+l*3;
      ctx.beginPath();
      ctx.moveTo(tx,ly-3);
      ctx.lineTo(tx-lw,ly+tH*0.28);
      ctx.lineTo(tx+lw,ly+tH*0.28);
      ctx.closePath();
      ctx.fillStyle=rgb(treeCol); ctx.fill();
    }
  }

  // ── Ground / meadow ──
  var groundY=hillY(W*0.5,7,H*0.85,0.06);
  var gDay=[28,55,25], gNight=[6,10,8];
  var gg=ctx.createLinearGradient(0,groundY,0,H);
  gg.addColorStop(0,rgb(lerpColor(gDay,gNight,mtDark)));
  gg.addColorStop(1,rgb(lerpColor([22,45,20],[5,8,6],mtDark)));
  ctx.fillStyle=gg;
  ctx.fillRect(0,groundY,W,H-groundY);

  // ── Fireflies at night ──
  if(nightAmount>0.5){
    var ffA=(nightAmount-0.5)*2;
    for(var i=0;i<12;i++){
      var fx=(time*0.02+i*137)%W;
      var fy=H*0.6+Math.sin(time*0.001+i*3)*H*0.12+Math.cos(time*0.0015+i*2)*10;
      var fa=ffA*(0.3+0.5*Math.sin(time*0.003+i*5));
      ctx.beginPath(); ctx.arc(fx,fy,2,0,Math.PI*2);
      ctx.fillStyle=rgba([220,255,120],fa); ctx.fill();
      ctx.beginPath(); ctx.arc(fx,fy,6,0,Math.PI*2);
      ctx.fillStyle=rgba([200,240,100],fa*0.15); ctx.fill();
    }
  }

  // ── Atmospheric haze between layers ──
  var hazeCol=lerpColor([180,195,220],[20,25,40],mtDark);
  var hazeG=ctx.createLinearGradient(0,H*0.55,0,H*0.75);
  hazeG.addColorStop(0,rgba(hazeCol,0.03));
  hazeG.addColorStop(0.5,rgba(hazeCol,0.06));
  hazeG.addColorStop(1,rgba(hazeCol,0));
  ctx.fillStyle=hazeG;
  ctx.fillRect(0,H*0.55,W,H*0.2);
}

resize();
window.addEventListener('resize',resize);

function loop(t){
  requestAnimationFrame(loop);
  drawScene(t);
}
requestAnimationFrame(loop);

})();
</script>
