<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get to Know Each Other — Aether</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#05080a;color:#e8e8ea;
  font-family:'Cormorant Garamond',Georgia,serif;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 28%,rgba(0,0,0,.75) 100%);
}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:22px;right:22px;z-index:60;display:flex;gap:12px;align-items:center}
.topbar a,.topbar button{
  background:rgba(10,14,16,.5);border:1px solid rgba(255,255,255,.18);color:#e8e8ea;
  font-family:'Cormorant Garamond',serif;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
  padding:.5rem .95rem;border-radius:999px;text-decoration:none;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .3s,border-color .3s,transform .3s;
}
.topbar a:hover,.topbar button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);transform:translateY(-2px)}

/* ---------- location label ---------- */
.loc{
  position:fixed;left:50%;top:7%;transform:translateX(-50%);z-index:30;
  font-size:.64rem;letter-spacing:.62em;text-transform:uppercase;
  color:rgba(240,238,228,.55);text-align:center;white-space:nowrap;
  opacity:0;filter:blur(14px);
  transition:opacity 2s ease,filter 2s ease;
  pointer-events:none;text-shadow:0 0 20px rgba(0,0,0,.8);
}
.loc.show{opacity:1;filter:blur(0)}

/* ---------- progress ---------- */
.progress{position:fixed;left:0;top:0;height:2px;width:0;z-index:50;
  background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.7));transition:width 1.4s ease}

/* ---------- stage ---------- */
.stage{position:relative;z-index:10;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
.scene{
  max-width:780px;width:100%;text-align:center;
  opacity:0;filter:blur(20px);transform:translateY(16px) scale(1.03);
  transition:opacity 1.8s ease,filter 1.8s ease,transform 1.8s ease;
}
.scene.show{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}
.scene.leaving{opacity:0;filter:blur(26px);transform:translateY(-12px) scale(.98);
  transition:opacity 1.2s ease,filter 1.2s ease,transform 1.2s ease}

/* words materializing out of fog */
.fw{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(10px);
  transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease}
.fw.in{opacity:1;filter:blur(0);transform:translateY(0)}

.whisper{font-size:.64rem;letter-spacing:.5em;text-transform:uppercase;opacity:.4;margin-bottom:1.5rem}
.question{
  font-family:'Spectral',serif;font-weight:300;font-style:italic;
  font-size:clamp(1.5rem,3.9vw,2.5rem);line-height:1.45;color:#f2ece0;
  text-shadow:0 0 30px rgba(0,0,0,.75);margin-bottom:2.1rem;
}
.answer-wrap{margin:0 auto;max-width:580px;display:flex;flex-direction:column;gap:1.1rem}
.answer-wrap input,.answer-wrap textarea{
  width:100%;background:rgba(8,12,14,.45);border:none;border-bottom:1px solid rgba(255,255,255,.28);
  color:#f4f1e9;font-family:'Cormorant Garamond',serif;font-size:1.22rem;
  padding:.85rem .6rem;text-align:center;outline:none;resize:none;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:border-color .35s,background .35s;
}
.answer-wrap textarea{min-height:105px;border:1px solid rgba(255,255,255,.18);border-radius:5px}
.answer-wrap input:focus,.answer-wrap textarea:focus{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.06)}
.answer-wrap input::placeholder,.answer-wrap textarea::placeholder{color:rgba(230,230,230,.28);font-style:italic}

.btn-row{display:flex;justify-content:center;gap:1rem;margin-top:.4rem}
.cta{
  background:transparent;border:1px solid rgba(255,255,255,.33);color:#eee;
  font-family:'Cormorant Garamond',serif;font-size:.74rem;letter-spacing:.4em;text-transform:uppercase;
  padding:.85rem 2.1rem;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block;
  transition:background .35s,border-color .35s,transform .35s,letter-spacing .35s;
}
.cta:hover{background:rgba(255,255,255,.12);border-color:#fff;transform:translateY(-2px);letter-spacing:.5em}
.cta:disabled{opacity:.3;cursor:not-allowed;transform:none;letter-spacing:.4em}

.aether{
  margin-top:1.5rem;font-family:'Spectral',serif;font-style:italic;font-weight:300;
  font-size:clamp(1.05rem,2.3vw,1.35rem);line-height:1.75;color:#ddd4c0;
  opacity:0;filter:blur(14px);transform:translateY(10px);
  transition:opacity 1.6s ease .25s,filter 1.6s ease .25s,transform 1.6s ease .25s;
  white-space:pre-line;text-shadow:0 0 22px rgba(0,0,0,.7);
}
.aether.show{opacity:1;filter:blur(0);transform:translateY(0)}
.aether-label{display:block;font-family:'Cormorant Garamond',serif;font-style:normal;
  font-size:.6rem;letter-spacing:.52em;text-transform:uppercase;color:rgba(221,212,192,.5);margin-bottom:.55rem}

.title-xl{font-family:'Spectral',serif;font-weight:300;font-size:clamp(2.2rem,6.6vw,4.6rem);
  letter-spacing:.1em;color:#f4efe3;line-height:1.15;text-shadow:0 0 34px rgba(0,0,0,.7)}
.sub-xl{margin-top:1.3rem;font-size:clamp(.7rem,1.9vw,.95rem);letter-spacing:.42em;text-transform:uppercase;opacity:.5}
.intro-text{margin:2.2rem auto 0;max-width:610px;font-size:clamp(1rem,2.1vw,1.18rem);
  line-height:1.95;font-style:italic;opacity:.76}
.status{margin-top:1.5rem;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;opacity:.55}

@media(max-width:600px){
  .topbar{top:14px;right:14px}
  .loc{top:5%;letter-spacing:.42em;font-size:.56rem}
  .question{font-size:1.42rem}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>
<div class="progress" id="prog"></div>
<div class="loc" id="locLabel"></div>

<div class="topbar">
  <button id="soundBtn">♪ sound: on</button>
  <a href="index.html">← back</a>
</div>

<main class="stage" id="stage"></main>

<script>
(function(){
'use strict';

/* ==================================================================
   >>> EMAIL ENDPOINT — change this anytime <<<
   ================================================================== */
var FORM_ENDPOINT = "https://formspree.io/f/xjyyopep";

/* ==================================================================
   QUESTIONS + AETHER'S RESPONSES
   ================================================================== */
var QUESTIONS = [
  { q:"What is your name?", ph:"whisper it softly…", type:"input", key:"name",
    a:"Quite an unusual name." },
  { q:"If you had a genie, what are the three wishes you would ask it?", ph:"three wishes…", type:"area", key:"wishes",
    a:"I see. I will wish for —\nThe power to have any superpowers,\nThe power to give any superpowers,\nAnd an infinite number of worlds to go on adventure." },
  { q:"If you could only eat three foods for the rest of your life, what would those be?", ph:"three forever foods…", type:"area", key:"foods",
    a:"Quite a unique choice. For me — Steak, Pizza with all the good toppings, and ice cream." },
  { q:"What is your favorite drink?", ph:"a favourite sip…", type:"input", key:"drink",
    a:"Oh, I prefer chocolate Milkshake and Hot Chocolate." },
  { q:"If you could have any superpower, what would it be and why?", ph:"one impossible gift…", type:"area", key:"superpower",
    a:"All of them." },
  { q:"If you could become a king or queen tomorrow, what is the first law you are making?", ph:"the first law of your reign…", type:"area", key:"law",
    a:"I haven't thought much of it." },
  { q:"What do you want to be when you grow up?", ph:"a quiet ambition…", type:"input", key:"future",
    a:"Powerful and rich." },
  { q:"If you could change one thing about yourself, what would it be?", ph:"a secret wish…", type:"area", key:"change",
    a:"Well, I won't change myself." }
];

/* ==================================================================
   CANVAS SETUP
   ================================================================== */
var canvas = document.getElementById('bg');
var ctx = canvas.getContext('2d');
var W=0,H=0,DPR=1,horizon=0;
var FOCAL = 300, Z_FAR = 1050, Z_NEAR = 26;

function rnd(a,b){ return a+Math.random()*(b-a); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function hexToRgb(h){
  h=h.replace('#','');
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function mixHex(h1,h2,t){
  var a=hexToRgb(h1), b=hexToRgb(h2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1,2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon = H*0.55;
  buildTrees();
  buildStars();
  buildGrass();
}
window.addEventListener('resize', resize);

/* ==================================================================
   LOCATIONS
   ================================================================== */
var LOCATIONS = [
  { key:'path',     label:'The Forest Path',      sky:['#0a1216','#0f1a1c','#122225'], treeN:95, clearPx:70,  stars:0.25, fog:0.9,  fogCol:'198,208,208' },
  { key:'cabin',    label:'The Lone Cabin',       sky:['#0b1014','#111a1f','#17242b'], treeN:70, clearPx:220, stars:0.35, fog:0.85, fogCol:'202,210,208' },
  { key:'deep',     label:'Deeper Still',         sky:['#070d10','#0b1316','#0e1a1c'], treeN:130,clearPx:40,  stars:0.08, fog:1.05, fogCol:'186,198,196' },
  { key:'river',    label:'The Whispering River', sky:['#0a1418','#101d22','#16272d'], treeN:62, clearPx:300, stars:0.45, fog:0.8,  fogCol:'205,216,218' },
  { key:'lake',     label:'The Still Lake',       sky:['#091019','#0e1a26','#132334'], treeN:46, clearPx:420, stars:0.8,  fog:0.65, fogCol:'208,220,228' },
  { key:'cliff',    label:"The Cliff's Edge",     sky:['#060b16','#0b1424','#132137'], treeN:30, clearPx:560, stars:1.0,  fog:0.55, fogCol:'202,214,226' },
  { key:'ruins',    label:'The Forgotten Ruins',  sky:['#0a0f12','#10171a','#161f22'], treeN:72, clearPx:260, stars:0.3,  fog:0.95, fogCol:'198,206,204' },
  { key:'grove',    label:'The Firefly Grove',    sky:['#0a0e18','#101624','#161e2e'], treeN:58, clearPx:430, stars:0.7,  fog:0.7,  fogCol:'206,212,216' },
  { key:'hollow',   label:'The Hollow Tree',      sky:['#090c10','#0d1317','#121a1d'], treeN:84, clearPx:340, stars:0.2,  fog:0.95, fogCol:'196,204,204' },
  { key:'clearing', label:'The Clearing',         sky:['#080d18','#0d1424','#121c30'], treeN:50, clearPx:470, stars:0.95, fog:0.6,  fogCol:'210,218,224' }
];

var locIndex = 0;
var loc = LOCATIONS[0];
var skyFrom = LOCATIONS[0].sky.slice();
var skyTo   = LOCATIONS[0].sky.slice();
var skyMix  = 1;

/* ==================================================================
   TREES (true forward-motion perspective)
   ================================================================== */
var trees = [];
function spawnTree(z){
  var maxOff = W*0.78 + 240;
  var minOff = loc.clearPx;
  if(minOff > maxOff-60) minOff = maxOff-60;
  var off = rnd(minOff, maxOff) * (Math.random()<0.5?-1:1);
  return {
    z: z,
    x: off * z / FOCAL,
    h: rnd(230, 470),
    w: rnd(16, 40),
    sway: rnd(0,6.28),
    ss: rnd(0.00035,0.0009),
    lean: rnd(-0.07,0.07),
    tone: rnd(0.85,1.15)
  };
}
function buildTrees(){
  trees = [];
  var n = loc.treeN;
  for(var i=0;i<n;i++) trees.push(spawnTree(rnd(Z_NEAR+40, Z_FAR)));
}

function drawTree(tr,t){
  var z = tr.z;
  if(z < Z_NEAR) return;
  var sc = FOCAL/z;
  var swayAmt = Math.sin(t*tr.ss + tr.sway) * 10;
  var sx = W/2 + (tr.x + swayAmt)*sc;
  var by = horizon + 150*sc;
  var th = tr.h*sc, tw = tr.w*sc;
  if(sx < -tw*3 || sx > W+tw*3) return;
  if(th < 1.2) return;

  var depth = clamp((z-60)/(Z_FAR-60),0,1);
  var alpha = clamp(1.05 - depth*1.15, 0.05, 1);
  var base = Math.round(lerp(5,34,depth)*tr.tone);
  ctx.fillStyle = 'rgba('+base+','+(base+3)+','+(base+4)+','+alpha+')';

  var topY = by - th;
  var lean = tr.lean*th*0.12;

  // trunk
  ctx.beginPath();
  ctx.moveTo(sx - tw*0.16, by);
  ctx.lineTo(sx + tw*0.16, by);
  ctx.lineTo(sx + tw*0.07 + lean, topY);
  ctx.lineTo(sx - tw*0.07 + lean, topY);
  ctx.closePath(); ctx.fill();

  // pine crown
  var cx = sx + lean;
  ctx.beginPath();
  ctx.moveTo(cx, topY - th*0.3);
  ctx.lineTo(cx - tw*1.25, topY + th*0.09);
  ctx.lineTo(cx - tw*0.45, topY + th*0.07);
  ctx.lineTo(cx - tw*1.6,  topY + th*0.32);
  ctx.lineTo(cx - tw*0.55, topY + th*0.30);
  ctx.lineTo(cx - tw*1.95, topY + th*0.58);
  ctx.lineTo(cx - tw*0.6,  topY + th*0.56);
  ctx.lineTo(cx - tw*2.2,  topY + th*0.84);
  ctx.lineTo(cx + tw*2.2,  topY + th*0.84);
  ctx.lineTo(cx + tw*0.6,  topY + th*0.56);
  ctx.lineTo(cx + tw*1.95, topY + th*0.58);
  ctx.lineTo(cx + tw*0.55, topY + th*0.30);
  ctx.lineTo(cx + tw*1.6,  topY + th*0.32);
  ctx.lineTo(cx + tw*0.45, topY + th*0.07);
  ctx.lineTo(cx + tw*1.25, topY + th*0.09);
  ctx.closePath(); ctx.fill();
}

/* ==================================================================
   STARS / FIREFLIES / FOG / GRASS / SMOKE
   ================================================================== */
var stars=[], flies=[], fogs=[], grass=[], smoke=[];

function buildStars(){
  stars=[];
  for(var i=0;i<170;i++) stars.push({x:rnd(0,W),y:rnd(0,horizon*0.98),r:rnd(.3,1.4),p:rnd(0,6.28)});
}
function buildGrass(){
  grass=[];
  for(var i=0;i<140;i++) grass.push({x:rnd(-40,W+40),y:rnd(horizon+40,H),h:rnd(10,46),p:rnd(0,6.28)});
}
(function buildFliesFog(){
  for(var i=0;i<34;i++) flies.push({x:rnd(0,1600),y:rnd(300,900),vx:rnd(-.28,.28),vy:rnd(-.16,.16),p:rnd(0,6.28),r:rnd(1,2.3)});
  for(var j=0;j<11;j++) fogs.push({x:rnd(-300,1900),y:rnd(300,1000),r:rnd(230,520),s:rnd(.07,.26)*(Math.random()<.5?-1:1),a:rnd(.05,.15),p:rnd(0,6.28)});
})();

/* ==================================================================
   SCENERY PER LOCATION
   ================================================================== */
function ground(topCol, botCol){
  var g = ctx.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,topCol); g.addColorStop(1,botCol);
  ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);
}
function moon(mx,my,r,glowA){
  var gl=ctx.createRadialGradient(mx,my,r*0.4,mx,my,r*7);
  gl.addColorStop(0,'rgba(214,228,232,'+glowA+')');
  gl.addColorStop(1,'rgba(214,228,232,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(mx,my,r*7,0,6.2832); ctx.fill();
  var mg=ctx.createRadialGradient(mx-r*.3,my-r*.3,r*.1,mx,my,r);
  mg.addColorStop(0,'#fbfdfa'); mg.addColorStop(.7,'#dfe8e4'); mg.addColorStop(1,'#b9c6c2');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,r,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(150,165,162,.22)';
  ctx.beginPath(); ctx.arc(mx-r*.3,my-r*.14,r*.19,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+r*.26,my+r*.24,r*.13,0,6.2832); ctx.fill();
}
function lightShafts(t,alpha){
  ctx.save();
  for(var i=0;i<5;i++){
    var x0 = W*(0.1+i*0.2) + Math.sin(t*0.0002+i)*30;
    var g = ctx.createLinearGradient(x0,0,x0+W*0.14,H*0.9);
    g.addColorStop(0,'rgba(200,215,205,'+(alpha)+')');
    g.addColorStop(1,'rgba(200,215,205,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(x0,0); ctx.lineTo(x0+W*0.07,0);
    ctx.lineTo(x0+W*0.22,H*0.95); ctx.lineTo(x0+W*0.05,H*0.95);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function waterBand(topY,t,colTop,colBot,shimmer){
  var g=ctx.createLinearGradient(0,topY,0,H);
  g.addColorStop(0,colTop); g.addColorStop(1,colBot);
  ctx.fillStyle=g; ctx.fillRect(0,topY,W,H-topY);
  for(var i=0;i<34;i++){
    var p=i/34;
    var y=topY + Math.pow(p,1.7)*(H-topY);
    var amp = 10+p*70;
    var a = (0.05+p*0.16)*shimmer;
    ctx.strokeStyle='rgba(205,225,232,'+a+')';
    ctx.lineWidth=0.8+p*1.6;
    ctx.beginPath();
    for(var x=-20;x<=W+20;x+=16){
      var yy = y + Math.sin(x*0.012 + t*0.0014 + i)*amp*0.045;
      if(x===-20) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
}
function treelineSilhouette(y,scale,alpha){
  ctx.fillStyle='rgba(8,13,14,'+alpha+')';
  ctx.beginPath(); ctx.moveTo(-20,y+40);
  var x=-20;
  while(x<W+40){
    var h=rndSeeded(x)*scale+scale*0.5;
    ctx.lineTo(x, y-h);
    ctx.lineTo(x+scale*0.5, y);
    x+=scale*0.5;
  }
  ctx.lineTo(W+40,y+40); ctx.closePath(); ctx.fill();
}
function rndSeeded(n){ var s=Math.sin(n*12.9898)*43758.5453; return s-Math.floor(s); }

/* ---- individual locations ---- */
function sceneryPath(t){
  ground('#0d1512','#070c0a');
  var g=ctx.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,'rgba(60,58,48,.35)'); g.addColorStop(1,'rgba(38,36,30,.65)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(W/2-18,horizon+6); ctx.lineTo(W/2+18,horizon+6);
  ctx.lineTo(W/2+W*0.42,H); ctx.lineTo(W/2-W*0.42,H);
  ctx.closePath(); ctx.fill();
  lightShafts(t,0.035);
}

function sceneryCabin(t){
  ground('#0c1312','#060a09');
  var cw=Math.min(300,W*0.3), ch=cw*0.62;
  var cx=W*0.5, cy=horizon+H*0.11;
  // warm pool of light on ground
  var pg=ctx.createRadialGradient(cx,cy+ch*0.5,10,cx,cy+ch*0.5,cw*1.6);
  pg.addColorStop(0,'rgba(255,182,96,.16)'); pg.addColorStop(1,'rgba(255,182,96,0)');
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(cx,cy+ch*0.5,cw*1.6,0,6.2832); ctx.fill();
  // body
  ctx.fillStyle='#120f0c';
  ctx.fillRect(cx-cw/2, cy-ch/2, cw, ch);
  // roof
  ctx.fillStyle='#0b0908';
  ctx.beginPath();
  ctx.moveTo(cx-cw*0.62, cy-ch/2);
  ctx.lineTo(cx, cy-ch*1.0);
  ctx.lineTo(cx+cw*0.62, cy-ch/2);
  ctx.closePath(); ctx.fill();
  // chimney
  ctx.fillStyle='#0d0b09';
  ctx.fillRect(cx+cw*0.26, cy-ch*0.92, cw*0.1, ch*0.42);
  // door
  ctx.fillStyle='#070605';
  ctx.fillRect(cx-cw*0.09, cy+ch*0.06, cw*0.18, ch*0.44);
  // windows
  var flick=0.78+0.22*Math.sin(t*0.004);
  [[-0.3,0.72],[0.26,0.86]].forEach(function(p,i){
    var wx=cx+cw*p[0], wy=cy-ch*0.12, ww=cw*0.17, wh=ch*0.26;
    var f=flick*(i?0.92:1);
    ctx.fillStyle='rgba(255,186,92,'+(0.85*f)+')';
    ctx.fillRect(wx,wy,ww,wh);
    var wg=ctx.createRadialGradient(wx+ww/2,wy+wh/2,2,wx+ww/2,wy+wh/2,ww*3.4);
    wg.addColorStop(0,'rgba(255,180,88,'+(0.3*f)+')'); wg.addColorStop(1,'rgba(255,180,88,0)');
    ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(wx+ww/2,wy+wh/2,ww*3.4,0,6.2832); ctx.fill();
    ctx.strokeStyle='rgba(20,14,8,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(wx+ww/2,wy); ctx.lineTo(wx+ww/2,wy+wh);
    ctx.moveTo(wx,wy+wh/2); ctx.lineTo(wx+ww,wy+wh/2); ctx.stroke();
  });
  // smoke
  if(smoke.length<26 && Math.random()<0.25)
    smoke.push({x:cx+cw*0.31,y:cy-ch*0.92,r:rnd(5,11),a:rnd(.1,.2),vy:rnd(.3,.7),vx:rnd(-.1,.3),p:rnd(0,6.28)});
  for(var s=smoke.length-1;s>=0;s--){
    var sm=smoke[s];
    sm.y-=sm.vy; sm.x+=sm.vx+Math.sin(t*0.001+sm.p)*0.25;
    sm.r+=0.42; sm.a-=0.0016;
    if(sm.a<=0){ smoke.splice(s,1); continue; }
    var sg=ctx.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,sm.r);
    sg.addColorStop(0,'rgba(190,196,196,'+sm.a+')'); sg.addColorStop(1,'rgba(190,196,196,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sm.x,sm.y,sm.r,0,6.2832); ctx.fill();
  }
}

/* ==================================================================
   TRAVEL STATE
   ================================================================== */
var travelling=false, travelT=0, TRAVEL_MS=3400, swapped=false, travelTarget=0;
var camSpeed=0, fogBoost=0;
var lastTS=0;

function travelTo(idx, onArrive){
  travelling=true; travelT=0; swapped=false; travelTarget=idx;
  skyFrom=LOCATIONS[locIndex].sky.slice();
  skyTo=LOCATIONS[idx].sky.slice();
  skyMix=0;
  playWhoosh();
  var dur=TRAVEL_MS;
  setTimeout(function(){ if(onArrive) onArrive(); }, dur+120);
}

/* ==================================================================
   MAIN LOOP
   ================================================================== */
function loop(ts){
  if(!lastTS) lastTS=ts;
  var dt=Math.min(60, ts-lastTS); lastTS=ts;
  var t=ts;

  if(travelling){
    travelT+=dt;
    var p=clamp(travelT/TRAVEL_MS,0,1);
    // ease in-out speed
    var sp = Math.sin(p*Math.PI);
    camSpeed = sp*2.4;
    fogBoost = Math.pow(sp,1.4);
    skyMix = p;
    if(!swapped && p>=0.5){
      swapped=true;
      locIndex=travelTarget; loc=LOCATIONS[locIndex];
      buildTrees(); buildGrass(); smoke=[];
      setAmbience(loc.key);
      showLocLabel(loc.label);
    }
    if(p>=1){ travelling=false; camSpeed=0; fogBoost=0; skyMix=1; }
  }

  // sky
  var s0 = skyMix>=1 ? skyTo[0] : mixHex(skyFrom[0],skyTo[0],skyMix);
  var s1 = skyMix>=1 ? skyTo[1] : mixHex(skyFrom[1],skyTo[1],skyMix);
  var s2 = skyMix>=1 ? skyTo[2] : mixHex(skyFrom[2],skyTo[2],skyMix);
  var sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,s0); sg.addColorStop(.55,s1); sg.addColorStop(1,s2);
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);

  // stars
  if(loc.stars>0.02){
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var tw=0.35+0.65*Math.abs(Math.sin(t*0.0012+st.p));
      ctx.globalAlpha=tw*loc.stars*0.75;
      ctx.fillStyle='#e9f2f0';
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // scenery
  var fn=SCENERY[loc.key]; if(fn) fn(t);

  // move + draw trees
  if(camSpeed>0){
    for(var k=0;k<trees.length;k++){
      var tr=trees[k];
      tr.z -= camSpeed*dt*0.42;
      if(tr.z < Z_NEAR){
        var nt=spawnTree(Z_FAR+rnd(0,120));
        trees[k]=nt;
      }
    }
  }
  trees.sort(function(a,b){ return b.z-a.z; });
  for(var m=0;m<trees.length;m++) drawTree(trees[m],t);

  // fog banks
  var fAll = loc.fog*(1+fogBoost*0.6);
  for(var f=0;f<fogs.length;f++){
    var fo=fogs[f];
    fo.x += fo.s*(1+camSpeed*0.6);
    if(fo.s>0 && fo.x-fo.r>W+200) fo.x=-fo.r-200;
    if(fo.s<0 && fo.x+fo.r<-200) fo.x=W+fo.r+200;
    var fy=(fo.y%(H+200)) + Math.sin(t*0.0002+fo.p)*22;
    var fg=ctx.createRadialGradient(fo.x,fy,0,fo.x,fy,fo.r);
    fg.addColorStop(0,'rgba('+loc.fogCol+','+(fo.a*fAll)+')');
    fg.addColorStop(1,'rgba('+loc.fogCol+',0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fo.x,fy,fo.r,0,6.2832); ctx.fill();
  }

  // fireflies
  var flyCount = (loc.key==='grove') ? flies.length : Math.round(flies.length*0.55);
  for(var fl=0; fl<flyCount; fl++){
    var ff=flies[fl];
    ff.x += ff.vx + Math.sin(t*0.001+ff.p)*0.3;
    ff.y += ff.vy + Math.cos(t*0.0012+ff.p)*0.22;
    if(ff.x<-12) ff.x=W+12; if(ff.x>W+12) ff.x=-12;
    if(ff.y<horizon*0.8) ff.vy=Math.abs(ff.vy);
    if(ff.y>H+10) ff.vy=-Math.abs(ff.vy);
    var gw=0.45+0.55*Math.sin(t*0.004+ff.p);
    var fgg=ctx.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,16);
    fgg.addColorStop(0,'rgba(255,228,148,'+(0.5*gw)+')');
    fgg.addColorStop(1,'rgba(255,228,148,0)');
    ctx.fillStyle=fgg; ctx.beginPath(); ctx.arc(ff.x,ff.y,16,0,6.2832); ctx.fill();
    ctx.fillStyle='rgba(255,243,196,'+(0.82*gw)+')';
    ctx.beginPath(); ctx.arc(ff.x,ff.y,ff.r,0,6.2832); ctx.fill();
  }

  // ground mist
  var gm=ctx.createLinearGradient(0,H*0.58,0,H);
  gm.addColorStop(0,'rgba('+loc.fogCol+',0)');
  gm.addColorStop(1,'rgba('+loc.fogCol+','+(0.2*fAll)+')');
  ctx.fillStyle=gm; ctx.fillRect(0,H*0.58,W,H*0.42);

  // travel whiteout
  if(fogBoost>0.001){
    ctx.fillStyle='rgba('+loc.fogCol+','+(fogBoost*0.9)+')';
    ctx.fillRect(0,0,W,H);
  }

  requestAnimationFrame(loop);
}

/* ==================================================================
   AUDIO
   ================================================================== */
var AC=null, musicOn=true, nodes=null, waterGain=null, lpFilter=null;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function noiseLoop(a,secs){
  var len=a.sampleRate*secs, b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.5;
  return b;
}
function startMusic(){
  var a=initAudio(); if(!a||nodes) return;
  if(a.state==='suspended') a.resume();
  var master=a.createGain(); master.gain.value=0; master.connect(a.destination);
  master.gain.linearRampToValueAtTime(0.12, a.currentTime+4);

  lpFilter=a.createBiquadFilter(); lpFilter.type='lowpass'; lpFilter.frequency.value=820; lpFilter.Q.value=0.6;
  lpFilter.connect(master);

  var freqs=[82.41,123.47,196.00,293.66,369.99]; // Em9
  var oscs=[];
  freqs.forEach(function(f,i){
    var o1=a.createOscillator(); o1.type = i<2?'sine':'triangle'; o1.frequency.value=f;
    var o2=a.createOscillator(); o2.type='sine'; o2.frequency.value=f*1.0032;
    var g=a.createGain(); g.gain.value=0.17/(i*0.6+1);
    o1.connect(g); o2.connect(g); g.connect(lpFilter);
    var lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.05+i*0.021;
    var lg=a.createGain(); lg.gain.value=g.gain.value*0.55;
    lfo.connect(lg); lg.connect(g.gain);
    o1.start(); o2.start(); lfo.start();
    oscs.push(o1,o2,lfo);
  });

  // wind
  var wn=a.createBufferSource(); wn.buffer=noiseLoop(a,3); wn.loop=true;
  var wf=a.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=400; wf.Q.value=0.7;
  var wg=a.createGain(); wg.gain.value=0.05;
  wn.connect(wf); wf.connect(wg); wg.connect(master); wn.start();

  // water (silent until river/lake)
  var wa=a.createBufferSource(); wa.buffer=noiseLoop(a,3); wa.loop=true;
  var waf=a.createBiquadFilter(); waf.type='bandpass'; waf.frequency.value=1100; waf.Q.value=0.5;
  waterGain=a.createGain(); waterGain.gain.value=0;
  wa.connect(waf); waf.connect(waterGain); waterGain.connect(master); wa.start();

  nodes={master:master,oscs:oscs,wn:wn,wa:wa};
  setAmbience(loc.key);
}
function stopMusic(){
  if(!nodes||!AC) return;
  var now=AC.currentTime;
  nodes.master.gain.cancelScheduledValues(now);
  nodes.master.gain.setValueAtTime(nodes.master.gain.value,now);
  nodes.master.gain.linearRampToValueAtTime(0,now+1.5);
  var n=nodes; nodes=null;
  setTimeout(function(){ try{ n.oscs.forEach(function(o){o.stop();}); n.wn.stop(); n.wa.stop(); }catch(e){} },1700);
}
function setAmbience(key){
  if(!AC||!waterGain||!lpFilter) return;
  var now=AC.currentTime;
  var wv = (key==='river')?0.085 : (key==='lake')?0.04 : 0;
  waterGain.gain.cancelScheduledValues(now);
  waterGain.gain.setValueAtTime(waterGain.gain.value,now);
  waterGain.gain.linearRampToValueAtTime(wv, now+2);
  var lpv = (key==='cliff'||key==='clearing'||key==='lake')?1500 : (key==='deep'||key==='hollow')?520 : 860;
  lpFilter.frequency.cancelScheduledValues(now);
  lpFilter.frequency.setValueAtTime(lpFilter.frequency.value,now);
  lpFilter.frequency.linearRampToValueAtTime(lpv, now+2.5);
}
function playWhoosh(){
  var a=initAudio(); if(!a||!musicOn) return;
  var now=a.currentTime;
  var src=a.createBufferSource(); src.buffer=noiseLoop(a,4);
  var f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=0.8;
  f.frequency.setValueAtTime(260,now);
  f.frequency.linearRampToValueAtTime(900,now+1.7);
  f.frequency.linearRampToValueAtTime(240,now+3.4);
  var g=a.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.085,now+1.3);
  g.gain.linearRampToValueAtTime(0.0001,now+3.4);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(now); src.stop(now+3.5);
}
function softClick(){
  var a=initAudio(); if(!a||!musicOn) return;
  var now=a.currentTime;
  var o=a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(620,now);
  o.frequency.exponentialRampToValueAtTime(230,now+0.22);
  var g=a.createGain();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.045,now+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.32);
  o.connect(g); g.connect(a.destination);
  o.start(now); o.stop(now+0.34);
}

var soundBtn=document.getElementById('soundBtn');
soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  musicOn=!musicOn;
  if(musicOn){ startMusic(); soundBtn.textContent='♪ sound: on'; }
  else { stopMusic(); soundBtn.textContent='♪ sound: off'; }
});
function firstGesture(){
  if(musicOn) startMusic();
  window.removeEventListener('click',firstGesture);
  window.removeEventListener('keydown',firstGesture);
  window.removeEventListener('touchstart',firstGesture);
}
window.addEventListener('click',firstGesture);
window.addEventListener('keydown',firstGesture);
window.addEventListener('touchstart',firstGesture);

/* ==================================================================
   LOCATION LABEL
   ================================================================== */
var locLabel=document.getElementById('locLabel');
var labelTimer=null;
function showLocLabel(txt){
  clearTimeout(labelTimer);
  locLabel.classList.remove('show');
  setTimeout(function(){
    locLabel.textContent=txt;
    locLabel.classList.add('show');
    labelTimer=setTimeout(function(){ locLabel.classList.remove('show'); }, 6500);
  }, 400);
}

/* ==================================================================
   SCENE FLOW
   ================================================================== */
var stage=document.getElementById('stage');
var prog=document.getElementById('prog');
var answers={}, step=-1, busy=false;

function fogWords(el,text){
  el.innerHTML='';
  var words=text.split(' ');
  words.forEach(function(w,i){
    var s=document.createElement('span');
    s.className='fw'; s.textContent=w;
    s.style.transitionDelay=(0.25+i*0.085)+'s';
    el.appendChild(s);
    el.appendChild(document.createTextNode(' '));
  });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var sp=el.querySelectorAll('.fw');
      for(var i=0;i<sp.length;i++) sp[i].classList.add('in');
    });
  });
}

function dissolveStage(cb){
  var kid=stage.firstElementChild;
  if(!kid){ cb(); return; }
  kid.classList.remove('show'); kid.classList.add('leaving');
  setTimeout(function(){ stage.innerHTML=''; cb(); },1250);
}
function mount(node){
  stage.appendChild(node);
  void node.offsetHeight;
  setTimeout(function(){ node.classList.add('show'); },60);
}
function updateProgress(){
  var total=QUESTIONS.length+2;
  prog.style.width=Math.min(100,((step+2)/total)*100)+'%';
}

/* ---------- INTRO ---------- */
function showIntro(){
  step=-1; updateProgress();
  showLocLabel(LOCATIONS[0].label);
  var s=document.createElement('div');
  s.className='scene';
  s.innerHTML=
    '<div class="title-xl">Get to Know<br>Each Other</div>'+
    '<div class="sub-xl">— a walk through the fog with Aether —</div>'+
    '<p class="intro-text">Lets take a walk and get to know etch other better. '+
    'This place is a little creepy but well I have always liked scary stuff a little. '+
    'When you are ready, we begin.</p>'+
    '<div class="btn-row" style="margin-top:2.4rem"><button class="cta" id="beginBtn">Begin the walk</button></div>';
  mount(s);
  document.getElementById('beginBtn').addEventListener('click',function(){
    if(busy) return; busy=true;
    softClick(); advance();
  });
}

/* ---------- QUESTION ---------- */
function showQuestion(i){
  step=i; updateProgress();
  var q=QUESTIONS[i];
  var s=document.createElement('div');
  s.className='scene';
  var field = q.type==='area'
    ? '<textarea id="ansField" rows="4" placeholder="'+q.ph+'"></textarea>'
    : '<input id="ansField" type="text" autocomplete="off" placeholder="'+q.ph+'">';
  s.innerHTML=
    '<div class="whisper">Question '+(i+1)+' of '+QUESTIONS.length+'</div>'+
    '<div class="question" id="qText"></div>'+
    '<div class="answer-wrap">'+field+
      '<div class="btn-row"><button class="cta" id="answerBtn" disabled>Answer</button></div>'+
      '<div class="aether" id="aetherResp"><span class="aether-label">Aether</span><span id="aetherText"></span></div>'+
      '<div class="btn-row" id="nextRow" style="display:none"><button class="cta" id="nextBtn">'+
        (i===QUESTIONS.length-1?'Finish':'Walk on')+'</button></div>'+
    '</div>';
  mount(s);
  fogWords(document.getElementById('qText'), q.q);

  var f=document.getElementById('ansField');
  var ab=document.getElementById('answerBtn');
  var ar=document.getElementById('aetherResp');
  var at=document.getElementById('aetherText');
  var nr=document.getElementById('nextRow');

  setTimeout(function(){ try{f.focus();}catch(e){} }, 1400);

  f.addEventListener('input',function(){ ab.disabled=f.value.trim().length===0; });
  f.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (q.type==='input' || e.ctrlKey) && !ab.disabled){ e.preventDefault(); ab.click(); }
  });

  ab.addEventListener('click',function(){
    var v=f.value.trim(); if(!v) return;
    answers[q.key]=v;
    f.disabled=true; ab.style.display='none';
    softClick();
    ar.classList.add('show');
    typeText(at,q.a,26,function(){
      nr.style.display='flex';
      document.getElementById('nextBtn').addEventListener('click',function(){
        if(busy) return; busy=true;
        softClick(); advance();
      });
    });
  });
}

function typeText(el,text,speed,done){
  el.textContent='';
  var i=0;
  (function tick(){
    if(i>=text.length){ if(done) done(); return; }
    el.textContent+=text.charAt(i); i++;
    setTimeout(tick,speed);
  })();
}

/* ---------- OUTRO ---------- */
function showOutro(){
  step=QUESTIONS.length; updateProgress();
  var s=document.createElement('div');
  s.className='scene';
  s.innerHTML=
    '<div class="title-xl">Thank you<br>for the walk.</div>'+
    '<p class="intro-text">The fog is thinner here. Your answers drift upward with it, '+
    'toward me. I will keep them where the fireflies rest.</p>'+
    '<div class="status" id="status">sending your words…</div>'+
    '<div class="btn-row" style="margin-top:2.4rem">'+
      '<a class="cta" href="index.html">Return Home</a></div>';
  mount(s);
  submitAnswers();
}

function submitAnswers(){
  var status=document.getElementById('status');
  var body={};
  QUESTIONS.forEach(function(q){ body[q.q]=answers[q.key]||''; });
  body._subject='New answers — Get to Know Each Other';

  if(!FORM_ENDPOINT || FORM_ENDPOINT.indexOf('REPLACE') !== -1){
    status.textContent='form not configured';
    console.log('ANSWERS:',body); return;
  }
  fetch(FORM_ENDPOINT,{
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    status.textContent = r.ok ? 'your words have arrived ✦'
                              : 'something stirred in the fog — please try again later';
  }).catch(function(){
    status.textContent='the forest swallowed the message — check your connection';
  });
}

/* ---------- ADVANCE (dissolve → travel → arrive) ---------- */
function advance(){
  var nextStep=step+1;
  var targetLoc=Math.min(nextStep+1, LOCATIONS.length-1);
  dissolveStage(function(){
    travelTo(targetLoc, function(){
      if(nextStep<QUESTIONS.length) showQuestion(nextStep);
      else showOutro();
      busy=false;
    });
  });
}

/* ==================================================================
   GO
   ================================================================== */
resize();
requestAnimationFrame(loop);
showIntro();

})();
</script>
</body>
</html>
