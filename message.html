<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aether · Send a Message</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0e0a;font-family:'Cormorant Garamond',serif}
canvas#deskCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.backlink{position:fixed;top:18px;left:20px;z-index:1000;color:#d4a57b;text-decoration:none;font-family:'Rajdhani',sans-serif;font-size:.95rem;letter-spacing:1px;opacity:.7;transition:opacity .3s}
.backlink:hover{opacity:1}
#envelope-container{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;cursor:pointer;transition:opacity .6s}
#envelope-wrap{position:relative;width:min(420px,85vw);height:min(280px,56vw)}
.env-body{position:absolute;bottom:0;width:100%;height:70%;background:linear-gradient(135deg,#f5e6c8,#e8d4a8,#f0dbb8);border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.env-body::before{content:'';position:absolute;inset:6px;border:1.5px solid rgba(139,90,43,.25);border-radius:2px;pointer-events:none}
.env-flap{position:absolute;top:0;left:0;width:100%;height:55%;background:linear-gradient(180deg,#e8d4a8,#dcc498);clip-path:polygon(0 40%,50% 100%,100% 40%,100% 0,0 0);border-radius:4px 4px 0 0;transform-origin:top center;transition:transform .8s cubic-bezier(.4,0,.2,1);z-index:2}
.env-seal{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:radial-gradient(circle,#c0392b,#8b1a1a);border-radius:50%;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:'Cinzel Decorative',serif;color:#f5e6c8;font-size:1.3rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.env-shadow{position:absolute;bottom:-8px;left:10%;width:80%;height:15px;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent);border-radius:50%}
.env-text{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;color:#5a3a1a;font-size:clamp(.7rem,2.5vw,1rem);letter-spacing:3px;white-space:nowrap;opacity:.7}
.env-hint{position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;color:#d4a57b;font-size:.85rem;letter-spacing:2px;opacity:0;animation:hintPulse 2s ease-in-out infinite;white-space:nowrap}
@keyframes hintPulse{0%,100%{opacity:0}50%{opacity:.8}}
.env-open .env-flap{transform:rotateX(180deg)}
#letter-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,5,3,.75);backdrop-filter:blur(4px);opacity:0;transition:opacity .5s}
#letter-overlay.show{display:flex;opacity:1}
#letter-scroll{position:relative;width:min(580px,92vw);max-height:88vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#8b5a2b #f5e6c8}
#letter-scroll::-webkit-scrollbar{width:6px}
#letter-scroll::-webkit-scrollbar-track{background:#f5e6c8}
#letter-scroll::-webkit-scrollbar-thumb{background:#8b5a2b;border-radius:3px}
#letter{position:relative;background:linear-gradient(180deg,#f8eed8,#f0dbb8,#e8d0a0,#f5e6c8);padding:clamp(28px,5vw,50px) clamp(24px,4vw,45px);padding-bottom:30px;border-radius:3px;box-shadow:0 15px 60px rgba(0,0,0,.6),inset 0 0 80px rgba(139,90,43,.08)}
#letter::before{content:'';position:absolute;inset:12px;border:1px solid rgba(139,90,43,.15);pointer-events:none}
.letter-header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(139,90,43,.2)}
.letter-header h2{font-family:'Cinzel Decorative',serif;color:#3a2210;font-size:clamp(1.1rem,3.5vw,1.6rem);margin-bottom:6px;letter-spacing:2px}
.letter-header p{font-family:'Cormorant Garamond',serif;color:#6b4226;font-size:.9rem;font-style:italic}
.letter-date{font-family:'Cormorant Garamond',serif;color:#8b6914;font-size:.85rem;text-align:right;margin-bottom:18px;font-style:italic}
.field-group{margin-bottom:16px}
.field-group label{display:block;font-family:'Cinzel Decorative',serif;color:#3a2210;font-size:.85rem;margin-bottom:6px;letter-spacing:1px}
.field-group input,.field-group textarea{width:100%;background:rgba(139,90,43,.06);border:1px solid rgba(139,90,43,.2);border-radius:3px;padding:10px 12px;font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:#2a1608;resize:none;outline:none;transition:border-color .3s,box-shadow .3s}
.field-group input:focus,.field-group textarea:focus{border-color:rgba(139,90,43,.45);box-shadow:0 0 12px rgba(139,90,43,.1)}
.field-group input::placeholder,.field-group textarea::placeholder{color:rgba(90,58,26,.35);font-style:italic}
.field-group textarea{min-height:120px;line-height:1.7}
.sig-section{margin-top:18px;margin-bottom:18px}
.sig-section label{display:block;font-family:'Cinzel Decorative',serif;color:#3a2210;font-size:.85rem;margin-bottom:8px;letter-spacing:1px}
.sig-wrap{position:relative;border:1px solid rgba(139,90,43,.25);border-radius:3px;background:rgba(255,252,240,.5);overflow:hidden;touch-action:none}
#sigCanvas{display:block;width:100%;cursor:crosshair;touch-action:none}
.sig-line{position:absolute;bottom:25px;left:10%;right:10%;height:1px;background:rgba(139,90,43,.18);pointer-events:none}
.sig-label-x{position:absolute;bottom:8px;left:10%;font-family:'Cormorant Garamond',serif;color:rgba(139,90,43,.25);font-size:.75rem;font-style:italic;pointer-events:none}
.sig-clear{position:absolute;top:6px;right:8px;background:none;border:none;font-family:'Rajdhani',sans-serif;color:#8b5a2b;font-size:.75rem;cursor:pointer;opacity:.5;letter-spacing:1px;padding:2px 6px}
.sig-clear:hover{opacity:1}
.letter-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btn-send,.btn-close{font-family:'Cinzel Decorative',serif;font-size:.85rem;letter-spacing:2px;padding:10px 28px;border:none;border-radius:3px;cursor:pointer;transition:all .3s}
.btn-send{background:linear-gradient(135deg,#5a3a1a,#8b5a2b);color:#f5e6c8;box-shadow:0 4px 15px rgba(90,58,26,.4)}
.btn-send:hover{box-shadow:0 6px 25px rgba(90,58,26,.6);transform:translateY(-1px)}
.btn-send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-close{background:rgba(139,90,43,.1);color:#5a3a1a;border:1px solid rgba(139,90,43,.25)}
.btn-close:hover{background:rgba(139,90,43,.2)}
.send-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(245,230,200,.3);border-top-color:#f5e6c8;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
#fold-overlay{position:fixed;inset:0;z-index:200;display:none;background:rgba(10,5,3,.9)}
#fold-overlay.active{display:block}
#foldCanvas{display:block;width:100%;height:100%}
#success-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;display:none;text-align:center;opacity:0;transition:opacity .8s}
#success-msg.show{display:block;opacity:1}
#success-msg h3{font-family:'Cinzel Decorative',serif;color:#d4a57b;font-size:clamp(1.2rem,4vw,1.8rem);margin-bottom:10px;letter-spacing:3px}
#success-msg p{font-family:'Cormorant Garamond',serif;color:#b89068;font-size:1.1rem;font-style:italic}
#success-msg .back-btn{display:inline-block;margin-top:24px;font-family:'Rajdhani',sans-serif;color:#d4a57b;text-decoration:none;font-size:.9rem;letter-spacing:2px;border:1px solid rgba(212,165,123,.3);padding:8px 24px;border-radius:3px;transition:all .3s}
#success-msg .back-btn:hover{background:rgba(212,165,123,.1);border-color:rgba(212,165,123,.6)}
.candle-glow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 30%,rgba(255,160,60,.04),transparent 70%);animation:candleFlicker 3s ease-in-out infinite alternate}
@keyframes candleFlicker{0%{opacity:.6}25%{opacity:.8}50%{opacity:.5}75%{opacity:.9}100%{opacity:.65}}
@media(max-width:500px){#letter{padding:20px 16px}.letter-header h2{font-size:1rem}}
</style>
</head>
<body>
<a class="backlink" href="index.html">&larr; home</a>
<canvas id="deskCanvas"></canvas>
<div class="candle-glow"></div>
<div id="envelope-container">
<div id="envelope-wrap">
<div class="env-flap"></div>
<div class="env-body"></div>
<div class="env-seal">A</div>
<div class="env-text">A MESSAGE FOR AETHER</div>
<div class="env-shadow"></div>
</div>
<div class="env-hint">click to open</div>
</div>
<div id="letter-overlay">
<div id="letter-scroll">
<div id="letter">
<div class="letter-header">
<h2>A Letter to Aether</h2>
<p>Write your words upon the parchment</p>
</div>
<div class="letter-date" id="letterDate"></div>
<form id="msgForm">
<div class="field-group">
<label>Your Name</label>
<input type="text" name="name" id="fName" placeholder="Who writes these words?" required>
</div>

<label>Your Message</label>

</div>

<div class="sig-label-x">sign here</div>
<button type="button" class="sig-clear" id="sigClear">clear</button>
</div>
</div>
<input type="hidden" name="signature" id="fSig">
<input type="hidden" name="_subject" value="A dove brings a message">
<div class="letter-actions">
<button type="submit" class="btn-send" id="btnSend">SEND BY DOVE</button>
<button type="button" class="btn-close" id="btnClose">CLOSE</button>
</div>
</form>
</div>
</div>
</div>
<div id="fold-overlay"><canvas id="foldCanvas"></canvas></div>

<h3>The Dove Has Departed</h3>
<p>Your message glides through golden light to Aether.</p>
<a class="back-btn" href="index.html">&larr; Return Home</a>
</div>

<script>
/* ========== DESK SCENE ========== */
(function(){
var C=document.getElementById('deskCanvas'),X=C.getContext('2d'),W,H,t=0;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
var candles=[{x:.16,y:.22,h:58},{x:.84,y:.18,h:52}];

function rr(c,x,y,w,h,r){
c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);
c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);
c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();
}

function drawScene(){
/* Wall */
var wg=X.createLinearGradient(0,0,0,H*.55);
wg.addColorStop(0,'#1a0e08');wg.addColorStop(.5,'#2a1a10');wg.addColorStop(1,'#1e1208');
X.fillStyle=wg;X.fillRect(0,0,W,H*.55);
/* Wainscoting */
var py=H*.35;
X.fillStyle='#1c1008';X.fillRect(0,py,W,H*.2);
X.strokeStyle='#3a2818';X.lineWidth=2;
X.beginPath();X.moveTo(0,py);X.lineTo(W,py);X.stroke();
X.beginPath();X.moveTo(0,py+H*.2);X.lineTo(W,py+H*.2);X.stroke();
var pw=W/5;
for(var i=0;i<5;i++){X.strokeStyle='rgba(60,40,20,.3)';X.lineWidth=1;X.strokeRect(i*pw+pw*.1,py+8,pw*.8,H*.2-16)}
/* Painting */
var fW=Math.min(W*.18,140),fH=fW*1.2,fx=W*.5-fW/2,fy=H*.06;
X.fillStyle='#3a2818';X.fillRect(fx-6,fy-6,fW+12,fH+12);
X.fillStyle='#2a1a0e';X.fillRect(fx-3,fy-3,fW+6,fH+6);
var pg=X.createLinearGradient(fx,fy,fx,fy+fH);
pg.addColorStop(0,'#1a2a1a');pg.addColorStop(.4,'#2a3a2a');pg.addColorStop(1,'#1a2a18');
X.fillStyle=pg;X.fillRect(fx,fy,fW,fH);
X.fillStyle='#2a3a22';X.beginPath();X.moveTo(fx,fy+fH*.6);
X.quadraticCurveTo(fx+fW*.3,fy+fH*.35,fx+fW*.5,fy+fH*.45);
X.quadraticCurveTo(fx+fW*.7,fy+fH*.3,fx+fW,fy+fH*.5);
X.lineTo(fx+fW,fy+fH);X.lineTo(fx,fy+fH);X.closePath();X.fill();
/* Desk */
var dY=H*.52;
var dg=X.createLinearGradient(0,dY,0,H);
dg.addColorStop(0,'#4a2e14');dg.addColorStop(.02,'#5c3a1c');dg.addColorStop(.05,'#4a3018');
dg.addColorStop(.3,'#3e2812');dg.addColorStop(1,'#2a1a0e');
X.fillStyle=dg;X.fillRect(0,dY,W,H-dY);
X.fillStyle='#6b4422';X.fillRect(0,dY,W,4);
X.fillStyle='#3a2210';X.fillRect(0,dY+4,W,2);
/* Wood grain */
X.strokeStyle='rgba(80,50,25,.12)';X.lineWidth=1;
for(var g=0;g<18;g++){var gy=dY+10+g*(H-dY-10)/18;X.beginPath();X.moveTo(0,gy);for(var gx=0;gx<W;gx+=40)X.lineTo(gx+20,gy+Math.sin(gx*.02+g)*2);X.stroke()}
[{x:.25,y:.65},{x:.6,y:.75},{x:.8,y:.6}].forEach(function(k){X.beginPath();X.ellipse(W*k.x,H*k.y,12,8,.3,0,Math.PI*2);X.fillStyle='rgba(50,30,12,.25)';X.fill()});
/* Blotter */
var bW=Math.min(W*.5,380),bH=Math.min(H*.28,200),bX=(W-bW)/2,bY=dY+H*.08;
X.fillStyle='#2a1a12';rr(X,bX-8,bY-6,bW+16,bH+12,4);X.fill();
X.fillStyle='#1e3a2a';rr(X,bX,bY,bW,bH,2);X.fill();
X.strokeStyle='rgba(180,150,80,.15)';X.lineWidth=1;X.strokeRect(bX+6,bY+5,bW-12,bH-10);
X.fillStyle='rgba(10,10,30,.12)';X.beginPath();X.ellipse(bX+bW*.3,bY+bH*.6,16,10,.4,0,Math.PI*2);X.fill();
/* Inkwell */
var ix=W*.12,iy=dY+H*.06;
X.fillStyle='#1a1a2e';X.beginPath();X.ellipse(ix,iy+20,22,8,0,0,Math.PI*2);X.fill();
var ig=X.createLinearGradient(ix-16,iy-10,ix+16,iy+20);
ig.addColorStop(0,'#2a2a40');ig.addColorStop(1,'#14142a');
X.fillStyle=ig;X.beginPath();X.moveTo(ix-16,iy+18);X.lineTo(ix-18,iy-5);X.quadraticCurveTo(ix-18,iy-15,ix,iy-16);X.quadraticCurveTo(ix+18,iy-15,ix+18,iy-5);X.lineTo(ix+16,iy+18);X.closePath();X.fill();
X.fillStyle='#3a3a55';X.beginPath();X.ellipse(ix,iy-12,16,6,0,0,Math.PI*2);X.fill();
X.fillStyle='#0a0a1e';X.beginPath();X.ellipse(ix,iy-12,13,4.5,0,0,Math.PI*2);X.fill();
X.strokeStyle='#b8962e';X.lineWidth=1.5;X.beginPath();X.ellipse(ix,iy+2,17,6,0,0,Math.PI*2);X.stroke();
/* Quill */
X.save();X.translate(ix+5,iy-16);X.rotate(-.5);
X.strokeStyle='#e8ddd0';X.lineWidth=2;X.beginPath();X.moveTo(0,0);X.lineTo(-70,-90);X.stroke();
for(var fb=0;fb<8;fb++){var bx2=-70+fb*8,by2=-90+fb*10;
X.fillStyle='rgba(240,235,225,.7)';X.beginPath();X.moveTo(bx2,by2);X.quadraticCurveTo(bx2-18,by2-12,bx2-12,by2-25);X.quadraticCurveTo(bx2-2,by2-15,bx2,by2);X.fill();
X.beginPath();X.moveTo(bx2,by2);X.quadraticCurveTo(bx2+15,by2-15,bx2+10,by2-28);X.quadraticCurveTo(bx2+2,by2-18,bx2,by2);X.fill()}
X.fillStyle='#8b7333';X.beginPath();X.moveTo(0,0);X.lineTo(-2,14);X.lineTo(0,18);X.lineTo(2,14);X.closePath();X.fill();
X.restore();
/* Fountain pen */
X.save();X.translate(W*.85,dY+H*.15);X.rotate(.15);
var fp=X.createLinearGradient(-60,-3,60,3);fp.addColorStop(0,'#1a1a3a');fp.addColorStop(.5,'#353570');fp.addColorStop(1,'#1a1a3a');
X.fillStyle=fp;rr(X,-60,-4,120,8,4);X.fill();
X.fillStyle='#c4a82e';X.fillRect(20,-5,3,10);X.fillRect(-20,-5,2,10);
X.beginPath();X.moveTo(25,-5);X.lineTo(55,-6);X.lineTo(55,-4);X.lineTo(25,-3);X.closePath();X.fill();
X.beginPath();X.moveTo(-60,-3);X.lineTo(-78,0);X.lineTo(-60,3);X.closePath();X.fill();
X.beginPath();X.arc(60,0,4,0,Math.PI*2);X.fill();
X.restore();
/* Watch */
var wx=W*.28,wy=dY+H*.32;
X.strokeStyle='#b8962e';X.lineWidth=1;X.beginPath();for(var ci=0;ci<6;ci++){X.moveTo(wx-30+ci*8,wy-10+Math.sin(ci)*3);X.ellipse(wx-30+ci*8+4,wy-10+Math.sin(ci)*3,4,2.5,.2,0,Math.PI*2)}X.stroke();
X.fillStyle='#d4b83e';X.beginPath();X.arc(wx,wy,14,0,Math.PI*2);X.fill();
X.fillStyle='#f5eed8';X.beginPath();X.arc(wx,wy,12,0,Math.PI*2);X.fill();
X.fillStyle='#2a1a08';for(var h=0;h<12;h++){var ha=h*Math.PI/6;X.beginPath();X.arc(wx+Math.sin(ha)*10,wy-Math.cos(ha)*10,.8,0,Math.PI*2);X.fill()}
X.strokeStyle='#1a0e08';X.lineWidth=1;X.beginPath();X.moveTo(wx,wy);X.lineTo(wx+5,wy-7);X.stroke();X.beginPath();X.moveTo(wx,wy);X.lineTo(wx-3,wy+4);X.stroke();
/* Papers */
for(var p=3;p>=0;p--){X.save();X.translate(W*.78+p*2,dY+H*.08+p*3);X.rotate((p-1.5)*.06);X.fillStyle=p%2?'#e8daba':'#f0e4cc';X.fillRect(-30,-20,60,45);X.strokeStyle='rgba(90,60,30,.1)';X.lineWidth=.5;for(var l=0;l<6;l++){X.beginPath();X.moveTo(-22,-12+l*8);X.lineTo(22,-12+l*8);X.stroke()}X.restore()}
/* Book */
X.save();X.translate(W*.08,dY+H*.28);X.rotate(-.08);
X.fillStyle='#5c1a1a';rr(X,-22,-15,44,32,2);X.fill();X.fillStyle='#4a1212';X.fillRect(-22,-15,6,32);
X.strokeStyle='#c4a82e';X.lineWidth=.5;X.strokeRect(-14,-11,32,24);X.fillStyle='#f0e4cc';X.fillRect(20,-13,3,28);X.restore();
/* Magnifier */
X.save();X.translate(W*.7,dY+H*.3);X.rotate(.6);
X.fillStyle='#5c3a1a';rr(X,-3,14,6,30,3);X.fill();X.strokeStyle='#b8962e';X.lineWidth=3;X.beginPath();X.arc(0,0,14,0,Math.PI*2);X.stroke();
X.fillStyle='rgba(200,220,255,.08)';X.beginPath();X.arc(0,0,12,0,Math.PI*2);X.fill();X.restore();
/* Spectacles */
X.save();X.translate(W*.62,dY+H*.12);X.rotate(.1);X.strokeStyle='#8b7333';X.lineWidth=1.5;
X.beginPath();X.ellipse(-12,0,10,7,0,0,Math.PI*2);X.stroke();X.beginPath();X.ellipse(12,0,10,7,0,0,Math.PI*2);X.stroke();
X.beginPath();X.moveTo(-2,0);X.quadraticCurveTo(0,-4,2,0);X.stroke();X.beginPath();X.moveTo(-22,0);X.lineTo(-35,8);X.stroke();X.beginPath();X.moveTo(22,0);X.lineTo(35,8);X.stroke();X.restore();
/* Wax stamp */
X.fillStyle='#3a2210';rr(X,W*.38-5,dY+H*.35-18,10,16,2);X.fill();
X.fillStyle='#4a2e14';X.beginPath();X.arc(W*.38,dY+H*.35,10,0,Math.PI*2);X.fill();
/* Coin */
X.fillStyle='#c4a82e';X.beginPath();X.ellipse(W*.55,dY+H*.38,7,6,.2,0,Math.PI*2);X.fill();
/* Candles */
candles.forEach(function(c){
var cx2=W*c.x,cy2=H*c.y,ch=c.h;
X.fillStyle='#8b7333';X.beginPath();X.ellipse(cx2,cy2+5,18,6,0,0,Math.PI*2);X.fill();

(function(){
var wrap=document.querySelector('.sig-wrap');
var canvas=document.getElementById('sigCanvas');
var ctx=canvas.getContext('2d');
var dpr=window.devicePixelRatio||1;
var W2,H2;
var isDrawing=false;
var points=[];
var allStrokes=[];
var lastVel=0;

function resizeCanvas(){
var rect=wrap.getBoundingClientRect();
W2=rect.width;H2=120;
canvas.style.width=W2+'px';
canvas.style.height=H2+'px';
canvas.width=Math.round(W2*dpr);
canvas.height=Math.round(H2*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);
redrawAll();
}

function redrawAll(){
ctx.clearRect(0,0,W2,H2);
allStrokes.forEach(function(stroke){drawStroke(stroke)});
}

function drawStroke(pts){
if(pts.length<2)return;
ctx.lineCap='round';ctx.lineJoin='round';
for(var i=1;i<pts.length;i++){
var p0=pts[i-1],p1=pts[i];
/* Velocity-based width: slower = thicker (ink pools), faster = thinner */
var dx=p1.x-p0.x,dy=p1.y-p0.y;
var dist=Math.sqrt(dx*dx+dy*dy);
var vel=dist/(p1.t-p0.t+1);
var width=Math.max(0.5,Math.min(3.5,3.5-vel*1.8));
/* Ink color varies slightly with pressure simulation */
var darkness=Math.max(15,Math.min(45,30+vel*10));
ctx.strokeStyle='rgba('+darkness+','+Math.round(darkness*.5)+','+Math.round(darkness*.3)+','+(0.85+Math.random()*.1)+')';
ctx.lineWidth=width;
if(i>=2){
var pp=pts[i-2];
var cpx=(p0.x+p1.x)/2,cpy=(p0.y+p1.y)/2;
ctx.beginPath();
ctx.moveTo((pp.x+p0.x)/2,(pp.y+p0.y)/2);
ctx.quadraticCurveTo(p0.x,p0.y,cpx,cpy);
ctx.stroke();
}else{
ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
}
/* Ink splatter on fast strokes */
if(vel>3&&Math.random()<.3){
ctx.fillStyle='rgba(25,12,8,.15)';
for(var s=0;s<2;s++){
var sx=p1.x+(Math.random()-.5)*8,sy=p1.y+(Math.random()-.5)*8;
ctx.beginPath();ctx.arc(sx,sy,.3+Math.random()*.5,0,Math.PI*2);ctx.fill();
}
}
}
/* Ink pool at start point */
if(pts.length>2){
var sp=pts[0];
ctx.fillStyle='rgba(25,12,8,.08)';
ctx.beginPath();ctx.arc(sp.x,sp.y,1.5+Math.random(),0,Math.PI*2);ctx.fill();
}
}

function getPos(e){
var rect=canvas.getBoundingClientRect();
var src=e.touches?e.touches[0]:e;
return{x:src.clientX-rect.left,y:src.clientY-rect.top,t:performance.now()};
}

function onStart(e){
e.preventDefault();e.stopPropagation();
isDrawing=true;
var p=getPos(e);
points=[p];
allStrokes.push(points);
}
function onMove(e){
if(!isDrawing)return;
e.preventDefault();e.stopPropagation();
var p=getPos(e);
points.push(p);
/* Incremental draw for performance */
if(points.length>=3){
var i=points.length-1;
var p0=points[i-1],p1=points[i];
var dx=p1.x-p0.x,dy=p1.y-p0.y;
var dist=Math.sqrt(dx*dx+dy*dy);
var vel=dist/(p1.t-p0.t+1);
var width=Math.max(0.5,Math.min(3.5,3.5-vel*1.8));
var darkness=Math.max(15,Math.min(45,30+vel*10));
ctx.strokeStyle='rgba('+darkness+','+Math.round(darkness*.5)+','+Math.round(darkness*.3)+',0.88)';
ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
var pp=points[i-2];
var cpx=(p0.x+p1.x)/2,cpy=(p0.y+p1.y)/2;
ctx.beginPath();
ctx.moveTo((pp.x+p0.x)/2,(pp.y+p0.y)/2);
ctx.quadraticCurveTo(p0.x,p0.y,cpx,cpy);
ctx.stroke();
if(vel>3&&Math.random()<.3){
ctx.fillStyle='rgba(25,12,8,.12)';
var sx=p1.x+(Math.random()-.5)*8,sy=p1.y+(Math.random()-.5)*8;
ctx.beginPath();ctx.arc(sx,sy,.4,0,Math.PI*2);ctx.fill();
}
}
}
function onEnd(e){
if(!isDrawing)return;
isDrawing=false;
/* Ink pool at lift point */
if(points.length>1){
var lp=points[points.length-1];
ctx.fillStyle='rgba(25,12,8,.06)';
ctx.beginPath();ctx.arc(lp.x,lp.y,1+Math.random(),0,Math.PI*2);ctx.fill();
}
points=[];
}

var bg=fX.createRadialGradient(cx,cy*.7,H*.1,cx,cy,H*.8);
bg.addColorStop(0,'rgba(40,25,15,.92)');bg.addColorStop(1,'rgba(10,5,3,.95)');
fX.fillStyle=bg;fX.fillRect(0,0,W,H);

/* Soft light rays */
fX.save();fX.globalAlpha=.03;
for(var r=0;r<5;r++){
var ra=-.4+r*.2+Math.sin(now*.0003+r)*.05;
fX.fillStyle='#ffd080';
fX.beginPath();
fX.moveTo(W*.8,0);
fX.lineTo(W*.8+Math.cos(ra)*W,Math.sin(ra)*H);
fX.lineTo(W*.8+Math.cos(ra+.08)*W,Math.sin(ra+.08)*H);
fX.closePath();fX.fill();
}
fX.restore();

if(phase===0){
/* Fold letter: 2.2s */
var fp=clamp(dt/2.2,0,1);
drawParch(lx,ly,lw,lh,eio(fp));
if(fp>=1){phase=1;phaseStart=now}
}
else if(phase===1){
/* Dove glides in from top-right: 2s */
drawParch(lx,ly,lw,lh,1);
var p1=clamp(dt/2,0,1);
var ep=1-Math.pow(1-p1,3);
dove.x=W+80-(W+80-cx-20)*ep;
dove.y=-60-(-60-cy+20)*ep;
dove.wingP+=.09;
/* Gentle banking turn as dove arrives */
var tilt2=-.2*(1-p1);
drawDove(dove.x,dove.y,1.3,dove.wingP,tilt2,false);
/* Trailing feathers */
if(Math.random()<.08)spawnFeather(dove.x+30,dove.y);
if(p1>=1){phase=2;phaseStart=now;dove.gx=dove.x;dove.gy=dove.y}
}
else if(phase===2){
/* Dove hovers and grabs letter in beak: 1.5s */
var p2=clamp(dt/1.5,0,1);
var ep2=eio(p2);
/* Letter shrinks toward dove's beak position */
var beakX=dove.gx-40,beakY=dove.gy-5;
var ls=1-ep2*.65;
var nlx=lerp(lx,beakX-lw*ls/2,ep2);
var nly=lerp(ly,beakY-lh*ls/4,ep2);
drawParch(nlx,nly,lw*ls,lh*ls,1);
/* Dove wing flutter (faster) */
dove.wingP+=.15;
/* Slight bob */
var bob=Math.sin(dt*4)*3;
drawDove(dove.gx,dove.gy+bob,1.3,dove.wingP,0,false);
/* Drop feathers during grab */
if(p2>.3&&p2<.8&&Math.random()<.12){spawnFeather(dove.gx+20,dove.gy+10);spawnFeather(dove.gx-10,dove.gy+15)}
if(p2>=1){phase=3;phaseStart=now}
}
else if(phase===3){
/* Dove flies away with letter in beak to upper-left: 3s */
var p3=clamp(dt/3,0,1);
var ep3=p3<.3?p3/.3*p3/.3:p3; /* slow start then cruise */
ep3=eio(p3);
dove.x=lerp(dove.gx,-200,ep3);
dove.y=lerp(dove.gy,-150,ep3);
dove.wingP+=.11;
/* Letter in beak */
var lss=.28*(1-p3*.2);
var ltilt=-.08;
fX.save();
fX.translate(dove.x-38,dove.y-4);
fX.rotate(ltilt);
drawParch(0,0,lw*lss,lh*lss,1);
fX.restore();
/* Banking tilt as dove turns */
var tilt3=.15*p3;
drawDove(dove.x,dove.y,1.3-p3*.2,dove.wingP,tilt3,false);
/* Feather trail */
if(Math.random()<.1+p3*.1)spawnFeather(dove.x+25+Math.random()*10,dove.y+Math.random()*15);
/* Scatter of feathers mid-flight */
if(p3>.2&&p3<.5&&Math.random()<.06){
for(var ff=0;ff<3;ff++)spawnFeather(dove.x+20+Math.random()*20,dove.y+5+Math.random()*10);
}
if(p3>=1){
/* Fade to success after brief delay */
setTimeout(function(){foldOvr.classList.remove('active');success.classList.add('show')},600);
/* Draw remaining feathers then stop */
(function fadeFeathers(n2){
if(feathers.length===0||n2>60)return;
fX.clearRect(0,0,W,H);fX.fillStyle='rgba(10,5,3,.95)';fX.fillRect(0,0,W,H);
updateFeathers();requestAnimationFrame(function(){fadeFeathers(n2+1)});
})(0);
return;
}
}

updateFeathers();
requestAnimationFrame(animF);
}

function updateFeathers(){
for(var fi=feathers.length-1;fi>=0;fi--){
var f=feathers[fi];
f.x+=f.vx;f.y+=f.vy;
f.vy+=.02; /* gentle gravity */
f.vx*=.995; /* air resistance */
/* Gentle sway */
f.vx+=Math.sin(f.rot*2)*.01;
f.rot+=f.rv;
f.rv*=.998;
f.life-=.005;
if(f.life<=0){feathers.splice(fi,1);continue}
drawFeather(f);
}
}

requestAnimationFrame(animF);
}
})();
</script>
