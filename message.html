<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&fami[...]
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#140a05;font-family:'Cormorant Garamond',serif}
canvas#deskCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* Top Right Menu */
.menu-btn{position:fixed;top:20px;right:25px;z-index:1000;color:#d4a57b;text-decoration:none;font-size:1.5rem;letter-spacing:2px;opacity:.7;transition:opacity .3s;cursor:pointer;font-family:sans-serif[...]
.menu-btn:hover{opacity:1}

/* Envelope Initial */
#envelope-container{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;cursor:pointer;transition:opacity .6s}
#envelope-wrap{position:relative;width:min(420px,85vw);height:min(280px,56vw)}
.env-body{position:absolute;bottom:0;width:100%;height:70%;background:linear-gradient(135deg,#cba67c,#b88f61);border-radius:2px;box-shadow:0 15px 40px rgba(0,0,0,.6)}
.env-flap{position:absolute;top:0;left:0;width:100%;height:55%;background:linear-gradient(180deg,#d4b58e,#cba67c);clip-path:polygon(0 40%,50% 100%,100% 40%,100% 0,0 0);border-radius:2px 2px 0 0;transf[...]
.env-seal{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%);width:45px;height:45px;background:radial-gradient(circle,#a12a2a,#731515);border-radius:50%;z-index:3;box-shadow:0 3px 10px [...]
.env-text{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);font-family:'Cinzel Decorative',serif;color:#4a3219;font-size:clamp(.7rem,2.5vw,.9rem);letter-spacing:2px;white-space:nowrap;[...]
.env-hint{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;color:#e3c6a5;font-size:.85rem;letter-spacing:2px;opacity:0;animation:hintPulse 2s ease-i[...]
@keyframes hintPulse{0%,100%{opacity:0}50%{opacity:.8}}
.env-open .env-flap{transform:rotateX(180deg)}

/* Letter overlay */
#letter-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,5,3,.6);backdrop-filter:blur(3px);opacity:0;transition:opacity .5s}
#letter-overlay.show{display:flex;opacity:1}
#letter-scroll{position:relative;width:min(540px,92vw);max-height:90vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#letter-scroll::-webkit-scrollbar{display:none}

/* Realistic Paper */
#letter{position:relative;background:#f2eedc;padding:clamp(30px,6vw,50px);border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 60px rgba(160,140,110,.2);color:#111b2e}
#letter::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3[...]
#letter::after{content:'';position:absolute;top:50%;left:0;right:0;height:4px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.08) 40%,rgba(255,255,255,.4) 60%,transparent);pointer-events:non[...]

.letter-date{font-family:'Dancing Script',cursive;font-size:1.4rem;text-align:right;margin-bottom:20px;color:#0e1726}
.letter-header{margin-bottom:25px}
.letter-header h2{font-family:'Dancing Script',cursive;font-size:2rem;font-weight:700;margin-bottom:10px;color:#0e1726}

.field-group{margin-bottom:20px}
.field-group input,.field-group textarea{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(17,27,46,.15);padding:8px 0;font-family:'Dancing Script',cursive;font-size:1.7rem;co[...]
.field-group input::placeholder,.field-group textarea::placeholder{color:rgba(17,27,46,.25)}
.field-group textarea{min-height:100px;border-bottom:none;background:repeating-linear-gradient(transparent,transparent 31px,rgba(17,27,46,.08) 31px,rgba(17,27,46,.08) 32px);line-height:32px;padding-to[...]

/* Signature */
.sig-section{margin-top:30px;position:relative}
.sig-wrap{position:relative;height:120px;cursor:crosshair;touch-action:none}
#sigCanvas{display:block;width:100%;height:100%}
.sig-line{position:absolute;bottom:20px;left:0;right:0;height:1px;background:rgba(17,27,46,.2);pointer-events:none}
.sig-clear{position:absolute;top:0;right:0;background:none;border:none;font-family:'Rajdhani',sans-serif;color:rgba(17,27,46,.4);font-size:.7rem;cursor:pointer;letter-spacing:1px;text-transform:upperc[...]
.sig-clear:hover{color:#0e1726}

.letter-actions{display:flex;gap:15px;justify-content:center;margin-top:40px;position:relative;z-index:2}
.btn-send,.btn-close{font-family:'Cinzel Decorative',serif;font-size:.8rem;letter-spacing:2px;padding:12px 30px;border:none;border-radius:2px;cursor:pointer;transition:all .3s}
.btn-send{background:#0e1726;color:#f2eedc;box-shadow:0 4px 15px rgba(14,23,38,.3)}
.btn-send:hover{background:#1a2a44;transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,23,38,.4)}
.btn-send:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-close{background:transparent;color:#0e1726;border:1px solid rgba(14,23,38,.3)}
.btn-close:hover{background:rgba(14,23,38,.05)}

.send-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(242,238,220,.3);border-top-color:#f2eedc;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;marg[...]
@keyframes spin{to{transform:rotate(360deg)}}

#fire-overlay{position:fixed;inset:0;z-index:200;display:none;background:transparent}
#fire-overlay.active{display:block}
#fireCanvas{display:block;width:100%;height:100%}

#success-msg h3{font-family:'Cinzel Decorative',serif;color:#d4a57b;font-size:clamp(1.2rem,4vw,1.8rem);margin-bottom:12px;letter-spacing:3px}

<body>

<a class="menu-btn" href="index.html" title="Return Home">&#8230;</a>
<canvas id="deskCanvas"></canvas>

<div id="envelope-container">
 <div id="envelope-wrap">
  <div class="env-flap"></div>
  <div class="env-body"></div>
  <div class="env-seal">A</div>
  <div class="env-text">A MESSAGE FOR AETHER</div>
 </div>
 <div class="env-hint">click to open</div>
</div>

<div id="letter-overlay">
 <div id="letter-scroll">
  <div id="letter">
   <div class="letter-date" id="letterDate"></div>
   <form id="msgForm">
    <div class="letter-header">
     <h2>Dearest Aether,</h2>
    </div>
    <div class="field-group">
     <input type="text" name="name" id="fName" placeholder="I write to you as..." required>
    </div>
    <div class="field-group">
     <textarea name="message" id="fMsg" placeholder="The thoughts I wish to share..." required></textarea>
    </div>
    <div class="sig-section">
     <div class="sig-wrap">
      <canvas id="sigCanvas"></canvas>
      <div class="sig-line"></div>
      <button type="button" class="sig-clear" id="sigClear">clear</button>
     </div>
    </div>
    <input type="hidden" name="signature" id="fSig">
    <input type="hidden" name="_subject" value="A message cast into the fire">
    <div class="letter-actions">
     <button type="submit" class="btn-send" id="btnSend">CAST INTO THE FIRE</button>
     <button type="button" class="btn-close" id="btnClose">CLOSE</button>
    </div>
   </form>
  </div>
 </div>
</div>

<div id="fire-overlay"><canvas id="fireCanvas"></canvas></div>

<div id="success-msg">
 <h3>The Flames Have Spoken</h3>
 <p>Your words drift as embers into the night.</p>
</div>

<script>
/* ================= DESK SCENE ================= */
(function(){
var C=document.getElementById('deskCanvas'),X=C.getContext('2d'),W,H,t=0;
function res(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
window.addEventListener('resize',res);res();

function drawDesk(){
 var wg=X.createRadialGradient(W*.3,H*.3,0,W*.5,H*.5,W);
 wg.addColorStop(0,'#4a2912');wg.addColorStop(1,'#140a05');
 X.fillStyle=wg;X.fillRect(0,0,W,H);

 /* Wood grain texture */
 X.strokeStyle='rgba(20,10,5,.3)';
 X.lineWidth=2;
 for(var i=0;i<40;i++){
  X.beginPath();X.moveTo(-100,i*H/30);
  for(var x=0;x<W+100;x+=50) X.lineTo(x,i*H/30+Math.sin(x*.01+i)*15);
  X.stroke();
 }

 /* --- Volumetric Sunbeam from Top Left --- */
 X.save();
 X.globalCompositeOperation='screen';
 var rayG=X.createLinearGradient(0,0,W*.7,H);
 rayG.addColorStop(0,'rgba(255,220,150,0.18)');
 rayG.addColorStop(.4,'rgba(255,190,100,0.08)');
 rayG.addColorStop(1,'rgba(0,0,0,0)');
 X.fillStyle=rayG;
 X.beginPath();
 X.moveTo(0,0);X.lineTo(W*.5,0);X.lineTo(W*.9,H);X.lineTo(0,H);
 X.fill();
 
 /* Dust motes */
 for(var d=0;d<30;d++){
  var dx=(W*.1+d*W*.02+Math.sin(t*.2+d)*50)%W;
  var dy=(H*.1+d*H*.03+Math.cos(t*.15+d)*40)%H;
  if(dx>dy*(W/H)+W*.2) continue;
  X.fillStyle='rgba(255,220,150,'+(Math.sin(t+d)*.4+.1)+')';
  X.beginPath();X.arc(dx,dy,Math.random()*1.5+.5,0,Math.PI*2);X.fill();
 }
 X.restore();

 /* --- Envelope & Wax Seal --- */
 X.save();
 X.translate(W*.75,H*.25);
 X.rotate(.2);
 X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=20;X.shadowOffsetX=5;X.shadowOffsetY=10;
 X.fillStyle='#cba67c';
 X.beginPath();X.moveTo(-100,-70);X.lineTo(100,-70);X.lineTo(100,70);X.lineTo(-100,70);X.fill();
 X.shadowColor='transparent';
 X.fillStyle='#b88f61';
 X.beginPath();X.moveTo(-100,-70);X.lineTo(0,10);X.lineTo(100,-70);X.fill();
 X.strokeStyle='rgba(0,0,0,.1)';X.lineWidth=1;X.stroke();
 X.fillStyle='#c29d74';
 X.beginPath();X.moveTo(-100,70);X.lineTo(0,10);X.lineTo(100,70);X.fill();X.stroke();
 X.fillStyle='#8b1a1a';
 X.beginPath();
 for(var a=0;a<Math.PI*2;a+=.4) X.lineTo(Math.cos(a)*(18+Math.sin(a*5+t*.0)*2),Math.sin(a)*(18+Math.sin(a*5+t*.0)*2));
 X.fill();
 X.fillStyle='#630d0d';
 X.beginPath();X.arc(0,0,12,0,Math.PI*2);X.fill();
 X.strokeStyle='rgba(255,200,150,.3)';X.lineWidth=1;
 X.beginPath();X.arc(0,0,8,0,Math.PI*2);X.stroke();
 X.restore();

 /* --- Glass Inkwell --- */
 X.save();
 X.translate(W*.18,H*.35);
 X.rotate(-.1);
 X.shadowColor='rgba(0,0,0,.8)';X.shadowBlur=25;X.shadowOffsetX=15;X.shadowOffsetY=15;
 X.fillStyle='rgba(200,210,220,0.15)';
 X.fillRect(-45,-45,90,90);
 X.shadowColor='transparent';
 X.fillStyle='#0a0f1a';
 X.fillRect(-35,-35,70,70);
 X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=3;
 X.strokeRect(-40,-40,80,80);
 X.strokeStyle='rgba(255,255,255,0.1)';X.lineWidth=10;
 X.strokeRect(-45,-45,90,90);
 X.fillStyle='rgba(255,255,255,0.2)';
 X.beginPath();X.moveTo(-45,-45);X.lineTo(-20,-45);X.lineTo(-45,-20);X.fill();
 X.beginPath();X.moveTo(20,45);X.lineTo(45,45);X.lineTo(45,20);X.fill();
 var capG=X.createLinearGradient(-25,-75,25,-75);
 capG.addColorStop(0,'#8a6b32');capG.addColorStop(.3,'#d4af37');capG.addColorStop(.7,'#a68028');capG.addColorStop(1,'#5c4516');
 X.fillStyle=capG;
 X.fillRect(-22,-75,44,30);
 X.fillStyle='#4a3510';
 X.beginPath();X.ellipse(0,-75,22,6,0,0,Math.PI*2);X.fill();
 X.beginPath();X.ellipse(0,-45,22,6,0,0,Math.PI*2);X.fill();
 X.fillStyle='rgba(255,255,255,0.4)';
 X.fillRect(-15,-75,4,30);
 X.restore();

 /* --- Tortoiseshell Pen --- */
 X.save();
 X.translate(W*.28,H*.75);
 X.rotate(.6);
 X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=15;X.shadowOffsetX=10;X.shadowOffsetY=10;
 var penG = X.createLinearGradient(-100, -8, 100, 16);
 penG.addColorStop(0, '#54210a');penG.addColorStop(0.2, '#994411');penG.addColorStop(0.4, '#381606');
 penG.addColorStop(0.6, '#b05517');penG.addColorStop(0.8, '#260e03');penG.addColorStop(1, '#75320e');
 X.fillStyle=penG;
 X.beginPath();X.roundRect(-100,-8,200,16,8);X.fill();
 X.shadowColor='transparent';
 X.fillStyle='#d4af37';
 X.fillRect(-60,-9,4,18);X.fillRect(40,-9,8,18);X.fillRect(80,-9,4,18);
 X.beginPath();X.moveTo(100,-6);X.lineTo(135,0);X.lineTo(100,6);X.fill();
 X.fillStyle='#1c0c04';
 X.beginPath();X.arc(115,0,2,0,Math.PI*2);X.fill();
 X.fillRect(115,-.5,20,1);
 var shineG = X.createLinearGradient(-100, -8, -100, 0);
 shineG.addColorStop(0, 'rgba(255,255,255,0.4)');shineG.addColorStop(1, 'rgba(255,255,255,0)');
 X.fillStyle=shineG;
 X.fillRect(-98,-6,196,6);
 X.restore();

 /* --- Spectacles --- */
 X.save();
 X.translate(W*.82,H*.55);
 X.rotate(-.4);
 X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=10;X.shadowOffsetX=5;X.shadowOffsetY=8;
 X.strokeStyle='#b89947';X.lineWidth=3;
 X.beginPath();X.arc(-35,0,25,0,Math.PI*2);X.stroke();
 X.beginPath();X.arc(35,0,25,0,Math.PI*2);X.stroke();
 X.beginPath();X.moveTo(-10,0);X.quadraticCurveTo(0,-10,10,0);X.stroke();
 X.beginPath();X.moveTo(-60,0);X.lineTo(-80,40);X.stroke();
 X.beginPath();X.moveTo(60,0);X.lineTo(40,50);X.stroke();
 X.shadowColor='transparent';
 X.fillStyle='rgba(255,255,255,0.08)';
 X.beginPath();X.arc(-35,0,23,0,Math.PI*2);X.fill();
 X.beginPath();X.arc(35,0,23,0,Math.PI*2);X.fill();
 X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=2;
 X.beginPath();X.arc(-35,0,18,3.5,4.5);X.stroke();
 X.beginPath();X.arc(35,0,18,3.5,4.5);X.stroke();
 X.restore();
}
(function frame(){t+=.016;X.clearRect(0,0,W,H);drawDesk();requestAnimationFrame(frame)})();
})();

/* ================= DATE ================= */
(function(){
var d=new Date(),mo=['January','February','March','April','May','June','July','August','September','October','November','December'];
var dy=d.getDate(),s='th';if(dy%10===1&&dy!==11)s='st';else if(dy%10===2&&dy!==12)s='nd';else if(dy%10===3&&dy!==13)s='rd';
document.getElementById('letterDate').textContent=mo[d.getMonth()]+' '+dy+s+', '+d.getFullYear();
})();

/* ================= ENVELOPE ================= */
(function(){
var ec=document.getElementById('envelope-container'),ew=document.getElementById('envelope-wrap'),ov=document.getElementById('letter-overlay'),bc=document.getElementById('btnClose');
ec.addEventListener('click',function(){
 ew.classList.add('env-open');
 setTimeout(function(){ec.style.opacity='0';setTimeout(function(){ec.style.display='none';ov.classList.add('show');window.dispatchEvent(new Event('resize'))},500)},600);
});
bc.addEventListener('click',function(){
 ov.classList.remove('show');
 setTimeout(function(){ec.style.display='';ew.classList.remove('env-open');setTimeout(function(){ec.style.opacity='1'},50)},400);
});
})();

/* ================= SIGNATURE CANVAS ================= */
(function(){
var wrap=document.querySelector('.sig-wrap'),canvas=document.getElementById('sigCanvas'),ctx=canvas.getContext('2d');
var dpr=window.devicePixelRatio||1,W2,H2,isDrawing=false,paths=[],currentPath=[];

function resizeCanvas(){
 var rect=wrap.getBoundingClientRect();
 W2=rect.width;H2=120;
 canvas.style.width=W2+'px';canvas.style.height=H2+'px';
 canvas.width=Math.round(W2*dpr);canvas.height=Math.round(H2*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 redrawAll();
}

function redrawAll(){
 ctx.clearRect(0,0,W2,H2);
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle='rgba(14, 23, 38, 0.9)'; 
 ctx.lineWidth=3; 
 paths.forEach(drawPath);
}

function drawPath(path){
 if(path.length<2){
  if(path.length===1){
   ctx.fillStyle='rgba(14, 23, 38, 0.9)';
   ctx.beginPath();ctx.arc(path[0].x,path[0].y,1.5,0,Math.PI*2);ctx.fill();
  }
  return;
 }
 ctx.beginPath();
 ctx.moveTo(path[0].x, path[0].y);
 for(var i=1; i<path.length-1; i++){
  var xc = (path[i].x + path[i+1].x) / 2;
  var yc = (path[i].y + path[i+1].y) / 2;
  ctx.quadraticCurveTo(path[i].x, path[i].y, xc, yc);
 }
 ctx.lineTo(path[path.length-1].x, path[path.length-1].y);
 ctx.stroke();
}

function getPos(e){
 var rect=canvas.getBoundingClientRect(), src=e.touches?e.touches[0]:e;
 return {x: src.clientX - rect.left, y: src.clientY - rect.top};
}

function start(e){e.preventDefault();isDrawing=true;currentPath=[getPos(e)];paths.push(currentPath);redrawAll();}
function move(e){if(!isDrawing)return;e.preventDefault();currentPath.push(getPos(e));redrawAll();}
function end(e){if(!isDrawing)return;isDrawing=false;}

canvas.addEventListener('pointerdown',start);
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',end);
canvas.addEventListener('pointerleave',end);
canvas.addEventListener('pointercancel',end);

document.getElementById('sigClear').addEventListener('click',function(){paths=[];redrawAll();});
window.addEventListener('resize',resizeCanvas);
new MutationObserver(function(){if(document.getElementById('letter-overlay').classList.contains('show'))setTimeout(resizeCanvas,100)}).observe(document.getElementById('letter-overlay'),{attributes:true,childList:true,subtree:true});

window._getSigData=function(){return canvas.toDataURL('image/png')};
window._hasSig=function(){return paths.length>0};
})();

/* ================= FORM + FIREPLACE ANIMATION ================= */
(function(){
var form=document.getElementById('msgForm'),btnSend=document.getElementById('btnSend');
var overlay=document.getElementById('letter-overlay'),fireOvr=document.getElementById('fire-overlay'),fireC=document.getElementById('fireCanvas'),fX=fireC.getContext('2d');
var success=document.getElementById('success-msg');

function eio(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function lerp(a,b,t){return a+(b-a)*t}
function lerpColor(c1, c2, t){
 return [Math.round(c1[0]+(c2[0]-c1[0])*t), Math.round(c1[1]+(c2[1]-c1[1])*t), Math.round(c1[2]+(c2[2]-c1[2])*t)];
}

/* Base Normal Fire: White -> Yellow -> Orange -> Red */
var normalTheme = [[255,255,255], [255,200,0], [255,100,0], [150,0,0]];

/* Magical Fire Palettes (Chosen randomly on submit) */
var magicThemes = [
 [[255,255,255], [0,255,255], [0,100,255], [0,0,150]],     /* Azure */
 [[255,255,255], [150,255,0], [0,200,0], [0,80,0]],        /* Emerald */
 [[255,255,255], [255,150,255], [150,0,255], [50,0,100]],  /* Amethyst */
 [[255,255,255], [255,200,200], [255,0,100], [100,0,50]],  /* Crimson */
 [[255,255,255], [200,200,255], [100,100,200], [50,50,100]]/* Ghost */
];

var currentMagicTheme;

form.addEventListener('submit',function(e){
 e.preventDefault();
 if(!document.getElementById('fName').value.trim()||!document.getElementById('fMsg').value.trim())return;
 document.getElementById('fSig').value=window._hasSig()?window._getSigData():'(no signature)';
 btnSend.disabled=true;btnSend.innerHTML='<span class="send-spinner"></span>CASTING...';
 
 /* Select random fire color for this message */
 currentMagicTheme = magicThemes[Math.floor(Math.random() * magicThemes.length)];

 fetch('https://formspree.io/f/xppplbvr',{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}
 }).then(function(r){if(!r.ok)throw new Error;startAnim()}).catch(function(){
  btnSend.disabled=false;btnSend.textContent='CAST INTO THE FIRE';alert('The fire rejected your words. Please try again.');
 });
});

function startAnim(){
 overlay.classList.remove('show');
 setTimeout(function(){fireOvr.classList.add('active');resF();runFireAnim()},400);
}
function resF(){fireC.width=window.innerWidth;fireC.height=window.innerHeight}
window.addEventListener('resize',function(){if(fireOvr.classList.contains('active'))resF()});

function runFireAnim(){
 var W=fireC.width, H=fireC.height, cx=W/2, cy=H/2;
 var phase=0, phaseStart=0, startT=null;
 var particles = [];
 var bgOpacity = 0;
 var flareBlend = 0; /* 0 = normal fire, 1 = magic fire */
 var flareIntensity = 1; /* multiplier for particle count/speed */
 var letter = {x: cx, y: cy, fold: 0, burn: 0, scale: 1, rot: 0};

 function spawnFire(x, y, amount) {
  for(var i=0; i<amount; i++) {
   var isSpark = Math.random() < 0.15;
   particles.push({
    x: x + (Math.random()-0.5)* (isSpark?300:200),
    y: y + (Math.random()-0.5)* 40,
    vx: (Math.random()-0.5)* (isSpark?80:30),
    vy: isSpark ? -150 - Math.random()*300 * flareIntensity : -80 - Math.random()*150 * flareIntensity,
    life: 1,
    decay: isSpark ? 0.005 + Math.random()*0.01 : (0.01 + Math.random()*0.015) / Math.max(1, flareIntensity*0.5),
    size: isSpark ? 1.5 + Math.random()*2 : 25 + Math.random()*40 * Math.max(1, flareIntensity*0.8),
    isSpark: isSpark
   });
  }
 }

 function getColor(theme, life) {
  if(life > 0.7) return lerpColor(theme[1], theme[0], (life-0.7)/0.3);
  if(life > 0.3) return lerpColor(theme[2], theme[1], (life-0.3)/0.4);
  return lerpColor(theme[3], theme[2], life/0.3);
 }

 function drawFire() {
  fX.globalCompositeOperation = 'lighter';
  for(var i=particles.length-1; i>=0; i--){
   var p = particles[i];
   p.x += p.vx * 0.016;
   p.y += p.vy * 0.016;
   
   if(p.isSpark) {
    p.vx += Math.sin(p.y*0.05)*2; /* sway */
   } else {
    /* Fire shrinks as it rises */
    p.vx *= 0.98;
   }
   
   p.life -= p.decay;
   if(p.life <= 0){ particles.splice(i,1); continue; }

   var cNorm = getColor(normalTheme, p.life);
   var cMag = getColor(currentMagicTheme, p.life);
   var c = lerpColor(cNorm, cMag, flareBlend);
   
   fX.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+(p.life * (p.isSpark?1:0.3))+')';
   fX.beginPath();
   fX.arc(p.x, p.y, Math.max(0.1, p.size * p.life), 0, Math.PI*2);
   fX.fill();
  }
  fX.globalCompositeOperation = 'source-over';
 }

 function drawFireplaceBg() {
  fX.fillStyle = 'rgba(10, 5, 2, ' + bgOpacity + ')';
  fX.fillRect(0,0,W,H);
  /* Vignette */
  var grad = fX.createRadialGradient(cx, cy+H*0.2, 0, cx, cy, Math.max(W,H));
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,' + (bgOpacity*0.9) + ')');
  fX.fillStyle = grad;
  fX.fillRect(0,0,W,H);

  /* Logs at bottom */
  fX.save();
  fX.globalAlpha = bgOpacity;
  fX.translate(cx, H);
  fX.fillStyle = '#080402';
  fX.beginPath();fX.roundRect(-150, -40, 300, 50, 10);fX.fill();
  fX.beginPath();fX.roundRect(-120, -70, 240, 45, 10);fX.fill();
  /* Log glow */
  var lg = fX.createLinearGradient(0,-70,0,-20);
  lg.addColorStop(0, 'rgba(255,80,0,'+ (0.3 + flareBlend*0.5) +')');
  lg.addColorStop(1, 'transparent');
  fX.fillStyle = lg;
  fX.beginPath();fX.roundRect(-120, -70, 240, 45, 10);fX.fill();
  fX.restore();
 }

 function drawFoldedLetter(lx, ly, w, h, fold, burnAmt, scale, rot) {
  fX.save();
  fX.translate(lx, ly);
  fX.scale(scale, scale);
  fX.rotate(rot);

  var w2 = lerp(w, w*0.35, fold), h2 = lerp(h, h*0.35, fold);
  
  fX.shadowColor = 'rgba(0,0,0,0.5)'; fX.shadowBlur = 20;
  fX.fillStyle = '#f2eedc';
  fX.fillRect(-w2/2, -h2/2, w2, h2);
  fX.shadowColor = 'transparent';

  if(fold > 0.8) {
   fX.globalAlpha = (fold-0.8)*5;
   /* Red Wax Seal */
   fX.fillStyle = '#8b1a1a';
   fX.beginPath(); fX.arc(0,0, 15, 0, Math.PI*2); fX.fill();
   fX.globalAlpha = 1;
  }

  /* Burn effect */
  if (burnAmt > 0) {
   /* Blacken */
   fX.fillStyle = 'rgba(10,5,0,' + Math.min(1, burnAmt * 1.5) + ')';
   fX.fillRect(-w2/2, -h2/2, w2, h2);
   
   /* Glowing Ember Edges */
   var magC = currentMagicTheme[1]; // Bright color of magic theme
   fX.strokeStyle = 'rgba('+magC[0]+','+magC[1]+','+magC[2]+',' + Math.min(1, burnAmt*2) + ')';
   fX.lineWidth = 3;
   fX.strokeRect(-w2/2, -h2/2, w2, h2);
  }
  fX.restore();
 }

 function anim(now){
  if(!startT){startT=now; phaseStart=now;}
  var dt=(now-phaseStart)/1000;
  var pw = Math.min(W*.8, 500), ph = Math.min(H*.6, 400);

  /* Always spawn base fire */
  spawnFire(cx, H-20, 3 * flareIntensity);

  fX.clearRect(0,0,W,H);
  drawFireplaceBg();

  if(phase === 0){
   /* Fade to fireplace & Fold letter (1.5s) */
   var p = Math.min(dt/1.5, 1);
   bgOpacity = p;
   letter.fold = eio(p);
   if(p>=1){ phase = 1; phaseStart = now; }
  }
  else if(phase === 1){
   /* Move to top center, ready to drop (1s) */
   var p = Math.min(dt/1, 1);
   letter.y = lerp(cy, H*0.2, eio(p));
   if(p>=1){ phase = 2; phaseStart = now; }
  }
  else if(phase === 2){
   /* Drop into fire (0.8s) */
   var p = Math.min(dt/0.8, 1);
   letter.y = lerp(H*0.2, H-60, p*p); /* accelerate down */
   letter.rot = p * 0.3;
   if(p>=1){ 
    phase = 3; phaseStart = now; 
    /* Initial spark burst */
    spawnFire(cx, H-50, 50);
   }
  }
  else if(phase === 3){
   /* Flare up & Burn (2.5s) */
   var p = Math.min(dt/2.5, 1);
   
   /* Transition fire color and intensity */
   flareBlend = Math.min(1, p * 1.5);
   flareIntensity = 1 + Math.sin(p * Math.PI) * 4; /* Surges up then down */
   
   letter.burn = p * 1.2;
   if (p > 0.6) {
    /* Letter dissolves */
    letter.scale = lerp(1, 0, (p-0.6)/0.4);
    if(Math.random() < 0.3) spawnFire(cx, H-60, 5); /* Extra sparks as it dies */
   }

   if(p>=1){ phase = 4; phaseStart = now; letter.scale = 0; }
  }
  else if(phase === 4){
   /* Fire settles into magic color (2s) */
   var p = Math.min(dt/2, 1);
   flareIntensity = lerp(1, 0.8, p); /* Settles down slightly */
   
   if(p >= 1){
    success.classList.add('show');
    /* Keep drawing the eternal magic fire loop */
    (function driftOut(){
     fX.clearRect(0,0,W,H);
     drawFireplaceBg();
     spawnFire(cx, H-20, 2);
     drawFire();
     requestAnimationFrame(driftOut);
    })();
    return;
   }
  }

  /* Draw letter if it still exists */
  if (letter.scale > 0) {
   drawFoldedLetter(letter.x, letter.y, pw, ph, letter.fold, letter.burn, letter.scale, letter.rot);
  }

  /* Draw flames OVER the letter so it gets consumed */
  drawFire();

  requestAnimationFrame(anim);
 }
 requestAnimationFrame(anim);
}
})();
</script>
</body>
</html>
